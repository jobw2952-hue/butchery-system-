<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bismillah Butchery Pro | Fresh Meat Always</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        .app-container { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
        .version-badge { position: fixed; bottom: 10px; right: 10px; background: #64748b; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; z-index: 999; cursor: pointer; }
        .version-badge:hover { background: #3b82f6; }
        .password-wrapper { position: relative; width: 100%; }
        .password-wrapper input { width: 100%; padding: 12px 45px 12px 16px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        .password-wrapper .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 0; }
        .password-wrapper .password-toggle:hover { color: #3b82f6; }
        .dashboard-layout { display: flex; gap: 24px; min-height: 85vh; }
        .sidebar { width: 280px; background: #ffffff; border-radius: 20px; padding: 24px 16px; border: 1px solid #e2e8f0; position: sticky; top: 20px; height: fit-content; }
        .logo-area { text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .logo-area h1 { font-size: 1.4rem; color: #1e293b; }
        .logo-area h1 i { color: #3b82f6; margin-right: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 0; border-radius: 12px; cursor: pointer; color: #475569; font-size: 0.9rem; transition: all 0.2s; }
        .nav-item:hover { background: #f1f5f9; color: #3b82f6; }
        .nav-item.active { background: #eff6ff; color: #3b82f6; font-weight: 500; }
        .main-content { flex: 1; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 24px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; }
        .role-badge { background: #f1f5f9; color: #475569; padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 500; }
        .role-badge-super { background: #8b5cf6; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .role-badge-admin { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: #ffffff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: #1e293b; }
        .card { background: #ffffff; border-radius: 20px; padding: 24px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; }
        .btn { background: #3b82f6; border: none; padding: 10px 20px; border-radius: 10px; color: white; font-weight: 500; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 0.7rem; border-radius: 6px; color: white; cursor: pointer; border: none; }
        .btn-delete:hover { background: #dc2626; }
        .btn-edit { background: #3b82f6; padding: 6px 12px; font-size: 0.7rem; border-radius: 6px; color: white; cursor: pointer; border: none; }
        .btn-edit:hover { background: #2563eb; }
        input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 6px; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { background: #f8fafc; padding: 14px 12px; text-align: left; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; }
        .data-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .data-table tr:hover { background: #f8fafc; }
        .progress-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .stock-item { background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; }
        .stock-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stock-name { font-weight: 600; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; height: 100%; transition: width 0.3s; }
        .progress-fill.low { background: linear-gradient(90deg, #ef4444, #f97316); }
        .login-container { max-width: 450px; margin: 60px auto; padding: 40px; background: #ffffff; border-radius: 24px; border: 1px solid #e2e8f0; text-align: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #ffffff; border-radius: 20px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
        .close-modal:hover { color: #ef4444; }
        .sales-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .sales-card { background: #f8fafc; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #e2e8f0; }
        .sales-card .amount { font-size: 1.8rem; font-weight: 700; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
        .report-selector { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 12px; }
        .alert-info { background: #e0f2fe; padding: 12px; border-radius: 10px; margin-top: 15px; color: #0369a1; }
        .password-cell { display: flex; align-items: center; gap: 8px; font-family: monospace; }
        .eye-icon { cursor: pointer; color: #94a3b8; }
        .eye-icon:hover { color: #3b82f6; }
        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .reset-confirm-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .reset-confirm-box { background: white; border-radius: 20px; padding: 30px; max-width: 400px; text-align: center; }
        .reset-confirm-box button { margin: 10px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .loading { text-align: center; padding: 60px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .sales-panel { grid-template-columns: 1fr; } .progress-section { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .dashboard-layout { flex-direction: column; } .sidebar { width: 100%; position: relative; } }
    </style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><p>Connecting to server...</p></div></div>
<div class="version-badge" onclick="showVersionInfo()">v6.0.0 🔗 Cloud Database</div>

<script>
    // ========== BISMILAH BUTCHERY PRO - ORIGINAL STYLE WITH FIXES ==========
    
    const API_URL = '';
    let token = localStorage.getItem('token');
    let currentUser = null;
    let currentPage = 'dashboard';
    let showCreateAccount = false;
    let selectedReport = 'daily';
    let loginPasswordVisible = false;
    let visiblePasswords = {};
    
    // Data stores
    let users = [];
    let inventory = [];
    let dailyClosings = [];
    let currentDaySales = { date: '', totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
    let expenses = [];
    let activityLogs = [];
    
    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        try {
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('token');
                token = null;
                currentUser = null;
                renderApp();
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            return null;
        }
    }
    
    async function loadAllData() {
        if (!token) return;
        
        const [usersData, invData, closingsData, salesData, expensesData, logsData] = await Promise.all([
            apiCall('/api/users'),
            apiCall('/api/inventory'),
            apiCall('/api/closings'),
            apiCall('/api/current-sales'),
            apiCall('/api/expenses'),
            apiCall('/api/logs')
        ]);
        
        users = usersData || [];
        inventory = invData || [];
        dailyClosings = closingsData || [];
        currentDaySales = salesData || { date: new Date().toISOString().split('T')[0], totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
        expenses = expensesData || [];
        activityLogs = logsData || [];
    }
    
    async function login(username, password) {
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.token) {
                token = data.token;
                currentUser = data.user;
                localStorage.setItem('token', token);
                await loadAllData();
                renderApp();
                return true;
            } else {
                alert(data.error || 'Invalid credentials!\n\nSuper Admin: superadmin / admin123\nAdmin: admin1 / admin123');
                return false;
            }
        } catch (error) {
            alert('Cannot connect to server. Make sure server is running on port 3000');
            return false;
        }
    }
    
    function logout() {
        localStorage.removeItem('token');
        token = null;
        currentUser = null;
        renderApp();
    }
    
    function isSuperAdmin() { return currentUser?.role === 'super_admin'; }
    function canManageUsers() { return isSuperAdmin(); }
    function canViewLogs() { return isSuperAdmin(); }
    function canDelete() { return isSuperAdmin(); }
    function canEditInventory() { return true; } // Both can edit
    
    function setPage(page) { currentPage = page; renderApp(); }
    
    // Toggle password visibility
    window.togglePasswordVisibility = (userId) => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can view passwords');
            return;
        }
        visiblePasswords[userId] = !visiblePasswords[userId];
        renderApp();
    };
    
    // RESET ALL DATA FUNCTION
    window.resetAllData = () => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can reset all data!');
            return;
        }
        
        const modalHtml = `
            <div class="reset-confirm-modal" id="resetConfirmModal">
                <div class="reset-confirm-box">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ef4444; margin-bottom:20px;"></i>
                    <h3 style="margin-bottom:15px;">⚠️ WARNING: RESET ALL DATA</h3>
                    <p style="margin-bottom:20px; color:#64748b;">This will permanently delete:</p>
                    <ul style="text-align:left; margin-bottom:20px; color:#64748b;">
                        <li>📊 All sales records</li>
                        <li>📅 All closed days</li>
                        <li>💸 All expenses</li>
                        <li>📋 All activity logs</li>
                        <li>📦 Set all inventory stock to 0 kg</li>
                    </ul>
                    <p style="color:#ef4444; margin-bottom:20px;"><strong>This action CANNOT be undone!</strong></p>
                    <button onclick="confirmReset()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-right:10px;">Yes, Reset Everything</button>
                    <button onclick="closeResetModal()" style="background:#94a3b8; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
                </div>
            </div>
        `;
        const existing = document.getElementById('resetConfirmModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.confirmReset = async () => {
        closeResetModal();
        
        try {
            const response = await fetch('/api/reset-all', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                await loadAllData();
                renderApp();
                alert('✅ All data has been reset to zero!');
            } else {
                alert('Reset failed. Please try again.');
            }
        } catch (error) {
            alert('Error resetting data. Make sure server is running.');
        }
    };
    
    window.closeResetModal = () => {
        const modal = document.getElementById('resetConfirmModal');
        if (modal) modal.remove();
    };
    
    // ADD USER MODAL
    window.showAddUserModal = () => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can add users');
            return;
        }
        
        const modalHtml = `
            <div class="modal" id="addUserModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-user-plus"></i> Add New User</h3>
                        <button class="close-modal" onclick="closeAddUserModal()">&times;</button>
                    </div>
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="newUserFullName" placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="newUserUsername" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="newUserPassword" placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" id="newUserConfirmPassword" placeholder="Confirm password">
                    </div>
                    <div class="form-group">
                        <label>Email (Optional)</label>
                        <input type="email" id="newUserEmail" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label>Phone (Optional)</label>
                        <input type="tel" id="newUserPhone" placeholder="Enter phone number">
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="newUserRole">
                            <option value="admin">Admin</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:12px; margin-top:20px;">
                        <button class="btn btn-success" onclick="submitAddUser()" style="flex:1;">Create User</button>
                        <button class="btn-delete" onclick="closeAddUserModal()" style="flex:1;">Cancel</button>
                    </div>
                </div>
            </div>
        `;
        const existing = document.getElementById('addUserModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.closeAddUserModal = () => {
        const modal = document.getElementById('addUserModal');
        if (modal) modal.remove();
    };
    
    window.submitAddUser = async () => {
        const fullName = document.getElementById('newUserFullName')?.value;
        const username = document.getElementById('newUserUsername')?.value;
        const password = document.getElementById('newUserPassword')?.value;
        const confirmPassword = document.getElementById('newUserConfirmPassword')?.value;
        const email = document.getElementById('newUserEmail')?.value;
        const phone = document.getElementById('newUserPhone')?.value;
        const role = document.getElementById('newUserRole')?.value;
        
        if (!fullName || !username || !password) {
            alert('Please fill all required fields (Full Name, Username, Password)');
            return;
        }
        
        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
        }
        
        if (password.length < 4) {
            alert('Password must be at least 4 characters');
            return;
        }
        
        const result = await apiCall('/api/users', 'POST', {
            username,
            password,
            fullName,
            role: role || 'admin',
            email: email || '',
            phone: phone || ''
        });
        
        if (result) {
            closeAddUserModal();
            await loadAllData();
            renderApp();
            alert(`✅ User "${username}" created successfully!`);
        } else {
            alert('Username already exists!');
        }
    };
    
    // Sales functions
    window.updateDailySales = async () => {
        if (currentDaySales.isClosed) return alert('Today is closed! Start a new day first.');
        const kg = parseFloat(document.getElementById('dailyKg')?.value);
        const cash = parseFloat(document.getElementById('dailyCash')?.value);
        const mpesa = parseFloat(document.getElementById('dailyMpesa')?.value);
        if (isNaN(kg) || kg <= 0) return alert('Enter valid KG');
        if (isNaN(cash) || cash < 0) return alert('Enter valid Cash');
        if (isNaN(mpesa) || mpesa < 0) return alert('Enter valid M-Pesa');
        
        const result = await apiCall('/api/current-sales', 'POST', { kg, cash: cash || 0, mpesa: mpesa || 0 });
        if (result) {
            await loadAllData();
            renderApp();
            alert('✅ Sales updated!');
            ['dailyKg', 'dailyCash', 'dailyMpesa'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = ''; });
        }
    };
    
    window.closeDay = async () => {
        if (currentDaySales.isClosed) return alert('Already closed');
        if (currentDaySales.totalKg === 0 && currentDaySales.cashAmount === 0 && currentDaySales.mpesaAmount === 0) return alert('No sales to close');
        const total = currentDaySales.cashAmount + currentDaySales.mpesaAmount;
        if (confirm(`Close ${currentDaySales.date}?\nKG: ${currentDaySales.totalKg} kg\nCash: KES ${currentDaySales.cashAmount.toLocaleString()}\nM-Pesa: KES ${currentDaySales.mpesaAmount.toLocaleString()}\nTotal: KES ${total.toLocaleString()}`)) {
            const result = await apiCall('/api/close-day', 'POST');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ Day closed!');
            }
        }
    };
    
    window.startNewDay = async () => {
        const today = new Date().toISOString().split('T')[0];
        if (!currentDaySales.isClosed && (currentDaySales.totalKg > 0 || currentDaySales.cashAmount > 0)) return alert('Close current day first');
        const result = await apiCall('/api/new-day', 'POST');
        if (result) {
            await loadAllData();
            renderApp();
            alert('✅ New day started!');
        }
    };
    
    // Inventory functions - Both Admin and Super Admin can edit
    window.openFullEditModal = async (productId) => {
        const product = inventory.find(p => p.id === productId);
        if (!product) return;
        
        const newStock = prompt(`Edit stock for ${product.name}\nCurrent stock: ${product.stockKg} kg\nEnter new stock quantity:`, product.stockKg);
        if (newStock !== null && !isNaN(parseFloat(newStock))) {
            const result = await apiCall(`/api/inventory/${productId}`, 'PUT', { ...product, stockKg: parseFloat(newStock) });
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ Stock updated!');
            }
        }
    };
    
    window.deleteInventoryProduct = async (productId) => {
        if (!canDelete()) return alert('Only Super Admin can delete products');
        const product = inventory.find(p => p.id === productId);
        if (product && confirm(`Delete "${product.name}"? This cannot be undone.`)) {
            const result = await apiCall(`/api/inventory/${productId}`, 'DELETE');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ Product deleted');
            }
        }
    };
    
    window.openAddStockModal = async () => {
        if (!isSuperAdmin()) return alert('Only Super Admin can add products');
        const name = prompt('Product name:');
        const animal = prompt('Animal (Cow/Goat/Chicken/Liver):');
        const stock = parseFloat(prompt('Stock kg:'));
        const price = parseFloat(prompt('Price per kg:'));
        if (name && animal && stock && price) {
            const result = await apiCall('/api/inventory', 'POST', { name, animal, stockKg: stock, priceKg: price });
            if (result) {
                await loadAllData();
                renderApp();
                alert(`✅ "${name}" added successfully!`);
            }
        }
    };
    
    // Expense functions
    window.addExpense = async () => {
        const category = document.getElementById('expCategory')?.value;
        const amount = parseFloat(document.getElementById('expAmount')?.value);
        const description = document.getElementById('expDesc')?.value;
        if (!category || isNaN(amount) || amount <= 0) return alert('Enter valid expense');
        
        const result = await apiCall('/api/expenses', 'POST', { category, amount, description: description || '' });
        if (result) {
            await loadAllData();
            renderApp();
            if (document.getElementById('expCategory')) document.getElementById('expCategory').value = '';
            if (document.getElementById('expAmount')) document.getElementById('expAmount').value = '';
            if (document.getElementById('expDesc')) document.getElementById('expDesc').value = '';
            alert('✅ Expense added');
        }
    };
    
    window.deleteExpense = async (expenseId) => {
        if (!canDelete()) return alert('Only Super Admin can delete expenses');
        const expense = expenses.find(e => e.id === expenseId);
        if (expense && confirm(`Delete expense: ${expense.category}?`)) {
            const result = await apiCall(`/api/expenses/${expenseId}`, 'DELETE');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ Expense deleted');
            }
        }
    };
    
    window.deleteClosingRecord = async (recordId) => {
        if (!canDelete()) return alert('Only Super Admin can delete closing records');
        if (confirm('Delete this closing record? This cannot be undone.')) {
            const result = await apiCall(`/api/closings/${recordId}`, 'DELETE');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ Record deleted');
            }
        }
    };
    
    // User management functions
    window.openEditUserModal = async (userId) => {
        if (!canManageUsers()) return alert('Only Super Admin can manage users');
        const user = users.find(u => u.id === userId);
        if (!user) return;
        
        const newFullName = prompt('Enter new full name:', user.fullName);
        if (newFullName && newFullName !== user.fullName) {
            const result = await apiCall(`/api/users/${userId}`, 'PUT', { fullName: newFullName });
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ User updated');
            }
        }
    };
    
    window.deleteUser = async (userId) => {
        if (!canManageUsers()) return alert('Only Super Admin can delete users');
        const user = users.find(u => u.id === userId);
        if (!user) return;
        if (user.username === 'superadmin') { alert('Cannot delete Super Admin!'); return; }
        if (user.id === currentUser?.id) { alert('Cannot delete your own account!'); return; }
        if (confirm(`Delete ${user.fullName}?`)) {
            const result = await apiCall(`/api/users/${userId}`, 'DELETE');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ User deleted');
            }
        }
    };
    
    // Profile edit
    window.openEditSelfModal = () => {
        const user = currentUser;
        const modalHtml = `<div class="modal" id="editSelfModal"><div class="modal-content"><div class="modal-header"><h3><i class="fas fa-user-edit"></i> Edit Your Profile</h3><button class="close-modal" onclick="closeEditSelfModal()">&times;</button></div>
            <div class="form-group"><label>Full Name</label><input type="text" id="editSelfFullName" value="${user.fullName.replace(/['"]/g, '&quot;')}"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editSelfEmail" value="${user.email || ''}"></div>
            <div class="form-group"><label>Phone</label><input type="text" id="editSelfPhone" value="${user.phone || ''}"></div>
            <div class="form-group"><label>New Password (leave blank to keep current)</label><input type="password" id="editSelfPassword" placeholder="Enter new password"></div>
            <div class="form-group"><label>Confirm New Password</label><input type="password" id="editSelfConfirmPassword" placeholder="Confirm new password"></div>
            <div style="display:flex; gap:12px; margin-top:10px;"><button class="btn btn-success" onclick="saveEditSelf()" style="flex:1;">Save Changes</button><button class="btn-delete" onclick="closeEditSelfModal()" style="flex:1;">Cancel</button></div></div></div>`;
        const existing = document.getElementById('editSelfModal'); if(existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.closeEditSelfModal = () => { const m = document.getElementById('editSelfModal'); if(m) m.remove(); };
    
    window.saveEditSelf = async () => {
        const newPassword = document.getElementById('editSelfPassword')?.value;
        const confirmPassword = document.getElementById('editSelfConfirmPassword')?.value;
        if (newPassword && newPassword !== confirmPassword) { alert('Passwords do not match!'); return; }
        if (newPassword && newPassword.length < 4) { alert('Password must be at least 4 characters'); return; }
        
        const updatedData = {
            fullName: document.getElementById('editSelfFullName')?.value,
            email: document.getElementById('editSelfEmail')?.value,
            phone: document.getElementById('editSelfPhone')?.value
        };
        if (newPassword) updatedData.password = newPassword;
        
        const result = await apiCall(`/api/users/${currentUser.id}`, 'PUT', updatedData);
        if (result) {
            await loadAllData();
            closeEditSelfModal();
            renderApp();
            alert('✅ Your profile has been updated!');
        }
    };
    
    // Create account
    window.showCreateAccountForm = () => { showCreateAccount = true; renderApp(); };
    window.hideCreateAccountForm = () => { showCreateAccount = false; renderApp(); };
    
    window.submitCreateAccount = async () => {
        const fullName = document.getElementById('createFullName')?.value;
        const username = document.getElementById('createUsername')?.value;
        const password = document.getElementById('createPassword')?.value;
        const confirm = document.getElementById('createConfirmPassword')?.value;
        const email = document.getElementById('createEmail')?.value;
        const phone = document.getElementById('createPhone')?.value;
        
        if (!fullName || !username || !password) { alert('Please fill all required fields'); return; }
        if (password !== confirm) { alert('Passwords do not match!'); return; }
        if (password.length < 4) { alert('Password must be at least 4 characters'); return; }
        
        const result = await apiCall('/api/users', 'POST', { username, password, fullName, role: 'admin', email, phone });
        if (result) {
            showCreateAccount = false;
            renderApp();
            alert(`✅ Account created!\nUsername: ${username}\nPassword: ${password}`);
        } else {
            alert('Username already exists!');
        }
    };
    
    window.changeReport = (value) => { selectedReport = value; renderApp(); };
    window.toggleLoginPassword = () => {
        loginPasswordVisible = !loginPasswordVisible;
        const input = document.getElementById('loginPasswordInput');
        if (input) input.type = loginPasswordVisible ? 'text' : 'password';
    };
    
    window.showVersionInfo = () => {
        alert(`📦 Bismillah Butchery Pro\n\nVersion: 6.0.0 (Cloud Database)\n\nData Status: ${dailyClosings.length} closed days, ${expenses.length} expenses, ${inventory.length} products\n\nAll data is stored in the cloud database!`);
    };
    
    // Render Dashboard
    function renderDashboard() {
        const totalInventoryValue = inventory.reduce((sum, i) => sum + (i.stockKg * i.costKg), 0);
        const todayTotal = currentDaySales.cashAmount + currentDaySales.mpesaAmount;
        const lowStock = inventory.filter(i => i.stockKg <= i.lowStockAlert).length;
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        const weeklyRevenue = dailyClosings
            .filter(r => new Date(r.date) >= sevenDaysAgo)
            .reduce((sum, r) => sum + r.totalRevenue, 0);
        
        // Get recent activities for dashboard
        const recentActivities = activityLogs.slice(0, 5);
        
        return `<div class="stats-grid">
            <div class="stat-card"><div class="stat-title">Today's Sales</div><div class="stat-value">KES ${todayTotal.toLocaleString()}</div><div class="stat-change">${currentDaySales.totalKg} kg sold today</div></div>
            <div class="stat-card"><div class="stat-title">Inventory Value</div><div class="stat-value">KES ${totalInventoryValue.toLocaleString()}</div><div class="stat-change">Based on cost price</div></div>
            <div class="stat-card"><div class="stat-title">Low Stock Alerts</div><div class="stat-value">${lowStock}</div><div class="stat-change">Items below threshold</div></div>
            <div class="stat-card"><div class="stat-title">7-Day Revenue</div><div class="stat-value">KES ${weeklyRevenue.toLocaleString()}</div><div class="stat-change">From ${dailyClosings.filter(r => new Date(r.date) >= sevenDaysAgo).length} closed days</div></div>
        </div>
        <div class="card"><div class="card-header"><h2><i class="fas fa-chart-line"></i> Stock Status</h2></div><div class="progress-section">${inventory.map(item => { const percent = Math.min(100, (item.stockKg / (item.lowStockAlert * 3)) * 100); const fillClass = percent < 30 ? 'low' : ''; return `<div class="stock-item"><div class="stock-info"><span class="stock-name">${item.name}</span><span>${item.stockKg} kg / ${item.lowStockAlert} kg alert</span></div><div class="progress-bar"><div class="progress-fill ${fillClass}" style="width: ${percent}%"></div></div></div>`; }).join('')}</div></div>
        <div class="card"><div class="card-header"><h2><i class="fas fa-history"></i> Recent Activities</h2></div><div class="table-container"><table class="data-table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${recentActivities.length === 0 ? '<td><td colspan="4" style="text-align:center; padding:40px;">No activities yet</td></tr>' : recentActivities.map(l => `<tr><td style="padding:8px">${l.timestamp}</td><td style="padding:8px">${l.user}</td><td style="padding:8px">${l.action}</td><td style="padding:8px">${l.details}</td></tr>`).join('')}</tbody>}</div></div>`;
    }
    
    // Render Reports
    function renderReports() {
        let filtered = selectedReport === 'daily' ? dailyClosings.slice(0,7) : dailyClosings;
        const totalRevenue = filtered.reduce((sum, r) => sum + r.totalRevenue, 0);
        const totalKg = filtered.reduce((sum, r) => sum + r.totalKg, 0);
        
        if (filtered.length === 0) {
            return `<div class="report-selector"><label>📊 Report Type</label><select onchange="changeReport(this.value)" style="width:auto;"><option value="daily" ${selectedReport === 'daily' ? 'selected' : ''}>📅 Last 7 Days</option><option value="monthly" ${selectedReport === 'monthly' ? 'selected' : ''}>📆 All Records</option></select></div>
            <div class="empty-state"><i class="fas fa-chart-line"></i><h3>No Reports Available</h3><p>Start by recording sales and closing days.</p><p style="margin-top:10px; font-size:0.85rem;">Go to <strong>Today's Sales</strong> to add your first sale.</p></div>`;
        }
        
        return `<div class="report-selector"><label>📊 Report Type</label><select onchange="changeReport(this.value)" style="width:auto;"><option value="daily" ${selectedReport === 'daily' ? 'selected' : ''}>📅 Last 7 Days</option><option value="monthly" ${selectedReport === 'monthly' ? 'selected' : ''}>📆 All Records (${dailyClosings.length} days)</option></select></div>
        <div style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); color:white; padding:20px; border-radius:16px; margin-bottom:20px; display:flex; justify-content:space-between; flex-wrap:wrap;"><div><h3>Total Revenue</h3><div style="font-size:2rem; font-weight:700;">KES ${totalRevenue.toLocaleString()}</div></div><div><h3>Total KG Sold</h3><div style="font-size:2rem; font-weight:700;">${totalKg} kg</div></div><div><h3>Average Per Day</h3><div style="font-size:1.5rem;">KES ${filtered.length ? Math.round(totalRevenue/filtered.length).toLocaleString() : 0}</div></div></div>
        <div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total Revenue</th><th>Closed By</th>${canDelete() ? '<th>Action</th>' : ''}</tr></thead><tbody>${filtered.map(r => `<td><td style="padding:8px">${r.date}</td><td style="padding:8px">${r.totalKg}</td><td style="padding:8px">KES ${r.cashAmount.toLocaleString()}</td><td style="padding:8px">KES ${r.mpesaAmount.toLocaleString()}</td><td style="padding:8px"><strong>KES ${r.totalRevenue.toLocaleString()}</strong></td><td style="padding:8px">${r.closedBy}</td>${canDelete() ? `<td style="padding:8px"><button class="btn-delete" onclick="deleteClosingRecord(${r.id})">Delete</button></td>` : ''}</tr>`).join('')}</tbody>}</div>`;
    }
    
    // Render Sales
    function renderSales() {
        return `<div class="sales-panel"><div class="sales-card"><h3>📦 Total KG Today</h3><div class="amount">${currentDaySales.totalKg} kg</div></div><div class="sales-card"><h3>💰 Cash Today</h3><div class="amount">KES ${currentDaySales.cashAmount.toLocaleString()}</div></div><div class="sales-card"><h3>📱 M-Pesa Today</h3><div class="amount">KES ${currentDaySales.mpesaAmount.toLocaleString()}</div></div></div>
        <div class="form-group"><label>🥩 Kilograms Sold</label><input type="number" id="dailyKg" step="0.1" placeholder="Enter kilograms sold"></div>
        <div class="form-group"><label>💵 Cash Amount (KES)</label><input type="number" id="dailyCash" placeholder="Enter cash amount"></div>
        <div class="form-group"><label>📲 M-Pesa Amount (KES)</label><input type="number" id="dailyMpesa" placeholder="Enter M-Pesa amount"></div>
        <div class="action-buttons"><button class="btn btn-success" onclick="updateDailySales()"><i class="fas fa-plus-circle"></i> Add Sale</button><button class="btn btn-warning" onclick="closeDay()"><i class="fas fa-lock"></i> Close Day</button><button class="btn" onclick="startNewDay()"><i class="fas fa-sun"></i> Start New Day</button></div>
        <div class="alert-info"><i class="fas fa-info-circle"></i> <strong>Date:</strong> ${currentDaySales.date} | <strong>Status:</strong> ${currentDaySales.isClosed ? '🔒 Closed' : '🟢 Open'}${currentDaySales.isClosed ? '<br>To record new sales, click "Start New Day"' : ''}</div>`;
    }
    
    async function renderApp() {
        const app = document.getElementById('app');
        
        if (!token || !currentUser) {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                token = savedToken;
                const me = await apiCall('/api/me');
                if (me) {
                    currentUser = me;
                    await loadAllData();
                    renderApp();
                    return;
                } else {
                    token = null;
                    localStorage.removeItem('token');
                }
            }
            
            app.innerHTML = `<div class="login-container"><i class="fas fa-drumstick-bite" style="font-size:48px; color:#3b82f6;"></i><h2 style="margin:20px 0;">Bismillah Butchery Pro</h2><div class="form-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Enter your username"></div><div class="form-group"><div class="password-wrapper"><label>Password</label><input type="password" id="loginPasswordInput" placeholder="Enter your password"><button class="password-toggle" onclick="toggleLoginPassword()" type="button"><i class="fas fa-eye"></i></button></div></div><button class="btn" style="width:100%;" onclick="login(document.getElementById('loginUsername').value, document.getElementById('loginPasswordInput').value)">Login</button><button class="create-account-btn" onclick="showCreateAccountForm()" style="margin-top:15px; background:none; border:none; color:#3b82f6; cursor:pointer;">+ Create New Account</button>${showCreateAccount ? `<div class="modal"><div class="modal-content"><h3>Create Admin Account</h3><input type="text" id="createFullName" placeholder="Full Name *" style="margin:10px 0; width:100%;"><input type="text" id="createUsername" placeholder="Username *" style="margin:10px 0; width:100%;"><input type="password" id="createPassword" placeholder="Password *" style="margin:10px 0; width:100%;"><input type="password" id="createConfirmPassword" placeholder="Confirm Password *" style="margin:10px 0; width:100%;"><input type="email" id="createEmail" placeholder="Email (Optional)" style="margin:10px 0; width:100%;"><input type="tel" id="createPhone" placeholder="Phone (Optional)" style="margin:10px 0; width:100%;"><button class="btn btn-success" onclick="submitCreateAccount()" style="width:100%;">Register</button><button class="btn-delete" onclick="hideCreateAccountForm()" style="margin-top:10px; width:100%;">Cancel</button></div></div>` : ''}</div>`;
            return;
        }
        
        const navItems = [
            { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard' },
            { id: 'sales', icon: 'fa-cash-register', label: 'Today\'s Sales' },
            { id: 'inventory', icon: 'fa-boxes', label: 'Inventory' },
            { id: 'expenses', icon: 'fa-receipt', label: 'Expenses' },
            { id: 'reports', icon: 'fa-chart-bar', label: 'Reports' }
        ];
        if (canManageUsers()) navItems.push({ id: 'users', icon: 'fa-users', label: 'Users' });
        if (canViewLogs()) navItems.push({ id: 'logs', icon: 'fa-history', label: 'Activity Logs' });
        
        app.innerHTML = `<div class="app-container"><div class="dashboard-layout"><div class="sidebar"><div class="logo-area"><h1><i class="fas fa-drumstick-bite"></i> Bismillah</h1><p>Premium Fresh Meat</p></div>${navItems.map(item => `<div class="nav-item ${currentPage === item.id ? 'active' : ''}" onclick="setPage('${item.id}')"><i class="fas ${item.icon}"></i> ${item.label}</div>`).join('')}${isSuperAdmin() ? `<div style="margin-top:20px; padding-top:20px; border-top:1px solid #e2e8f0;"><div class="nav-item" onclick="resetAllData()" style="color:#ef4444;">Reset All Data</div></div>` : ''}</div><div class="main-content"><div class="top-bar"><div><h3>${currentUser.fullName} ${isSuperAdmin() ? '<i class="fas fa-crown" style="color:#f59e0b;"></i>' : ''}</h3><span class="role-badge">${isSuperAdmin() ? '🌟 Super Admin' : '👤 Admin'}</span></div><div><button class="btn-edit" onclick="openEditSelfModal()" style="margin-right:10px;"><i class="fas fa-user-edit"></i> Edit Profile</button><button class="btn-delete" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="card"><div class="card-header"><h2>${navItems.find(i=>i.id===currentPage)?.label || 'Dashboard'}</h2>${currentPage === 'inventory' && isSuperAdmin() ? `<button class="btn" onclick="openAddStockModal()"><i class="fas fa-plus"></i> Add Product</button>` : ''}${currentPage === 'users' && isSuperAdmin() ? `<button class="btn btn-success" onclick="showAddUserModal()" style="margin-left:10px;"><i class="fas fa-user-plus"></i> Add User</button>` : ''}</div><div>${currentPage === 'dashboard' ? renderDashboard() : currentPage === 'sales' ? renderSales() : currentPage === 'inventory' ? `<div class="table-container"><table class="data-table"><thead><tr><th>Name</th><th>Animal</th><th>Stock (kg)</th><th>Price/kg</th><th>Cost/kg</th><th>Status</th><th>Actions</th></tr></thead><tbody>${inventory.map(p => `<tr><td style="padding:8px">${p.name}</td><td style="padding:8px">${p.animal}</td><td style="padding:8px">${p.stockKg}</td><td style="padding:8px">KES ${p.priceKg}</td><td style="padding:8px">KES ${p.costKg}</td><td style="padding:8px">${p.stockKg <= p.lowStockAlert ? '<span style="color:#ef4444;">⚠️ Low Stock</span>' : '<span style="color:#10b981;">✓ In Stock</span>'}</td><td style="padding:8px"><button class="btn-edit" onclick="openFullEditModal(${p.id})">Edit Stock</button> ${isSuperAdmin() ? `<button class="btn-delete" onclick="deleteInventoryProduct(${p.id})">Delete</button>` : ''}</td></tr>`).join('')}</tbody>}</div>` : currentPage === 'expenses' ? `<div class="form-group"><label>Expense Category</label><input id="expCategory" placeholder="e.g., Transport, Utilities, Rent"></div><div class="form-group"><label>Amount (KES)</label><input id="expAmount" type="number" placeholder="Enter amount"></div><div class="form-group"><label>Description (Optional)</label><textarea id="expDesc" placeholder="Additional details"></textarea></div><button class="btn btn-success" onclick="addExpense()"><i class="fas fa-plus"></i> Add Expense</button><div class="table-container" style="margin-top:20px;"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th><th>Action</th></tr></thead><tbody>${expenses.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:40px;">No expenses recorded yet</td></tr>' : expenses.map(e => `<td><td style="padding:8px">${e.date}</td><td style="padding:8px">${e.category}</td><td style="padding:8px">KES ${e.amount.toLocaleString()}</td><td style="padding:8px">${e.description || '-'}</td><td style="padding:8px">${isSuperAdmin() ? `<button class="btn-delete" onclick="deleteExpense(${e.id})">Delete</button>` : 'View Only'}</td></tr>`).join('')}</tbody>}</div>` : currentPage === 'reports' ? renderReports() : currentPage === 'users' ? `<div class="table-container"><table class="data-table"><thead><tr><th>Full Name</th><th>Username</th><th>Password</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${users.map(u => `<td><td style="padding:8px">${u.fullName}</td><td style="padding:8px">${u.username}</td><td class="password-cell" style="padding:8px">${isSuperAdmin() ? (visiblePasswords[u.id] ? u.password : '••••••') : '••••••'} ${isSuperAdmin() ? `<i class="fas ${visiblePasswords[u.id] ? 'fa-eye-slash' : 'fa-eye'} eye-icon" onclick="togglePasswordVisibility(${u.id})"></i>` : ''}</td><td style="padding:8px"><span class="${u.role === 'super_admin' ? 'role-badge-super' : 'role-badge-admin'}">${u.role === 'super_admin' ? '👑 Super Admin' : '👤 Admin'}</span></td><td style="padding:8px">${u.isActive ? '✅ Active' : '❌ Inactive'}</td><td style="padding:8px">${u.lastLogin || 'Never'}</td><td style="padding:8px">${u.username !== 'superadmin' ? `<button class="btn-edit" onclick="openEditUserModal(${u.id})">Edit</button> <button class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>` : '<span class="role-badge-super">Protected</span>'}</td></tr>`).join('')}</tbody>}</div>` : `<div class="table-container"><table class="data-table"><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>${activityLogs.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:40px;">No activity logs yet</td></tr>' : activityLogs.slice(0, 100).map(l => `<tr><td style="padding:8px">${l.timestamp}</td><td style="padding:8px">${l.user}</td><td style="padding:8px">${l.userRole}</td><td style="padding:8px">${l.action}</td><td style="padding:8px">${l.details}</td></tr>`).join('')}</tbody>}</div>`}</div></div></div></div></div>`;
    }
    
    // Initialize
    (async () => {
        const savedToken = localStorage.getItem('token');
        if (savedToken) {
            token = savedToken;
            const me = await apiCall('/api/me');
            if (me) {
                currentUser = me;
                await loadAllData();
            } else {
                token = null;
                localStorage.removeItem('token');
            }
        }
        renderApp();
    })();
</script>
</body>
</html>
