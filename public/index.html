<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bismillah Butchery Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; }
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 20px; text-align: center; }
        .dashboard-container { display: flex; min-height: 100vh; }
        .sidebar { width: 260px; background: #1e293b; color: white; padding: 20px; }
        .sidebar h2 { text-align: center; margin-bottom: 30px; }
        .nav-item { padding: 12px; margin: 5px 0; border-radius: 8px; cursor: pointer; }
        .nav-item:hover { background: #334155; }
        .nav-item.active { background: #3b82f6; }
        .main-content { flex: 1; padding: 20px; }
        .top-bar { background: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; }
        .btn { background: #3b82f6; color: white; padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; }
        .btn-success { background: #10b981; }
        .btn-warning { background: #f59e0b; }
        .btn-danger { background: #ef4444; }
        .btn-sm { padding: 4px 8px; font-size: 12px; margin: 0 2px; }
        input, select { width: 100%; padding: 8px 12px; border: 1px solid #e2e8f0; border-radius: 8px; margin-top: 5px; }
        .form-group { margin-bottom: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: white; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #3b82f6; }
        .eye-icon { cursor: pointer; margin-left: 8px; color: #64748b; }
        .eye-icon:hover { color: #3b82f6; }
        .loading { text-align: center; padding: 50px; }
        @media (max-width: 768px) { .dashboard-container { flex-direction: column; } .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>
<div id="app"><div class="loading">Loading...</div></div>

<script>
    // ========== BISMILAH BUTCHERY PRO - WORKING VERSION ==========
    
    let token = localStorage.getItem('token');
    let currentUser = null;
    let currentPage = 'dashboard';
    let users = [];
    let inventory = [];
    let dailyClosings = [];
    let currentDaySales = null;
    let expenses = [];
    let activityLogs = [];
    let visiblePasswords = {};
    
    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        try {
            const response = await fetch(endpoint, options);
            if (response.status === 401) {
                localStorage.removeItem('token');
                token = null;
                currentUser = null;
                renderApp();
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            return null;
        }
    }
    
    async function login() {
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        const result = await apiCall('/api/login', 'POST', { username, password });
        
        if (result && result.token) {
            token = result.token;
            currentUser = result.user;
            localStorage.setItem('token', token);
            await loadData();
            renderApp();
        } else {
            alert('Invalid credentials! Use: superadmin / admin123');
        }
    }
    
    function logout() {
        localStorage.removeItem('token');
        token = null;
        currentUser = null;
        renderApp();
    }
    
    async function loadData() {
        if (!token) return;
        
        const [usersData, invData, closingsData, salesData, expensesData, logsData] = await Promise.all([
            apiCall('/api/users'),
            apiCall('/api/inventory'),
            apiCall('/api/closings'),
            apiCall('/api/current-sales'),
            apiCall('/api/expenses'),
            apiCall('/api/logs')
        ]);
        
        users = usersData || [];
        inventory = invData || [];
        dailyClosings = closingsData || [];
        currentDaySales = salesData;
        expenses = expensesData || [];
        activityLogs = logsData || [];
    }
    
    function isSuperAdmin() { return currentUser?.role === 'super_admin'; }
    
    // Toggle password visibility
    window.togglePassword = (userId) => {
        visiblePasswords[userId] = !visiblePasswords[userId];
        renderApp();
    };
    
    // Add User Modal
    window.showAddUser = () => {
        const modalHtml = `
            <div class="modal" id="userModal">
                <div class="modal-content">
                    <h3>Add New User</h3>
                    <div class="form-group"><label>Full Name</label><input type="text" id="newFullName" placeholder="Full Name"></div>
                    <div class="form-group"><label>Username</label><input type="text" id="newUsername" placeholder="Username"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="newPassword" placeholder="Password"></div>
                    <div class="form-group"><label>Confirm Password</label><input type="password" id="newConfirmPassword" placeholder="Confirm Password"></div>
                    <div class="form-group"><label>Role</label><select id="newRole"><option value="admin">Admin</option><option value="super_admin">Super Admin</option></select></div>
                    <button class="btn btn-success" onclick="createUser()">Create</button>
                    <button class="btn" style="background:#94a3b8;" onclick="closeModal()">Cancel</button>
                </div>
            </div>
        `;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.closeModal = () => {
        const modal = document.getElementById('userModal');
        if (modal) modal.remove();
    };
    
    window.createUser = async () => {
        const fullName = document.getElementById('newFullName')?.value;
        const username = document.getElementById('newUsername')?.value;
        const password = document.getElementById('newPassword')?.value;
        const confirm = document.getElementById('newConfirmPassword')?.value;
        const role = document.getElementById('newRole')?.value;
        
        if (!fullName || !username || !password) {
            alert('Please fill all required fields');
            return;
        }
        if (password !== confirm) {
            alert('Passwords do not match');
            return;
        }
        
        const result = await apiCall('/api/users', 'POST', { username, password, fullName, role });
        if (result) {
            closeModal();
            await loadData();
            renderApp();
            alert('User created successfully!');
        } else {
            alert('Username already exists');
        }
    };
    
    // Edit stock
    window.editStock = async (productId) => {
        const product = inventory.find(p => p.id === productId);
        const newStock = prompt(`Edit stock for ${product.name}\nCurrent: ${product.stockKg} kg\nEnter new stock:`, product.stockKg);
        if (newStock && !isNaN(parseFloat(newStock))) {
            const result = await apiCall(`/api/inventory/${productId}`, 'PUT', { ...product, stockKg: parseFloat(newStock) });
            if (result) {
                await loadData();
                renderApp();
                alert('Stock updated!');
            }
        }
    };
    
    // Delete product
    window.deleteProduct = async (productId) => {
        if (!isSuperAdmin()) return alert('Only Super Admin can delete');
        if (confirm('Delete this product?')) {
            await apiCall(`/api/inventory/${productId}`, 'DELETE');
            await loadData();
            renderApp();
            alert('Product deleted');
        }
    };
    
    // Add product
    window.addProduct = async () => {
        if (!isSuperAdmin()) return alert('Only Super Admin can add');
        const name = prompt('Product name:');
        const animal = prompt('Animal:');
        const stock = parseFloat(prompt('Stock kg:'));
        const price = parseFloat(prompt('Price per kg:'));
        if (name && animal && stock && price) {
            await apiCall('/api/inventory', 'POST', { name, animal, stockKg: stock, priceKg: price });
            await loadData();
            renderApp();
            alert('Product added!');
        }
    };
    
    // Add sale
    window.addSale = async () => {
        const kg = parseFloat(document.getElementById('saleKg')?.value);
        const cash = parseFloat(document.getElementById('saleCash')?.value);
        const mpesa = parseFloat(document.getElementById('saleMpesa')?.value);
        if (!kg || kg <= 0) return alert('Enter valid KG');
        
        await apiCall('/api/current-sales', 'POST', { kg, cash: cash || 0, mpesa: mpesa || 0 });
        await loadData();
        renderApp();
        alert('Sale added!');
        document.getElementById('saleKg').value = '';
        document.getElementById('saleCash').value = '';
        document.getElementById('saleMpesa').value = '';
    };
    
    // Close day
    window.closeDay = async () => {
        if (confirm('Close today?')) {
            await apiCall('/api/close-day', 'POST');
            await loadData();
            renderApp();
            alert('Day closed!');
        }
    };
    
    // New day
    window.newDay = async () => {
        await apiCall('/api/new-day', 'POST');
        await loadData();
        renderApp();
        alert('New day started!');
    };
    
    // Add expense
    window.addExpense = async () => {
        const category = document.getElementById('expCategory')?.value;
        const amount = parseFloat(document.getElementById('expAmount')?.value);
        if (!category || !amount) return alert('Enter category and amount');
        
        await apiCall('/api/expenses', 'POST', { category, amount });
        await loadData();
        renderApp();
        document.getElementById('expCategory').value = '';
        document.getElementById('expAmount').value = '';
        alert('Expense added!');
    };
    
    // Delete expense
    window.deleteExpense = async (id) => {
        if (!isSuperAdmin()) return alert('Only Super Admin can delete');
        if (confirm('Delete expense?')) {
            await apiCall(`/api/expenses/${id}`, 'DELETE');
            await loadData();
            renderApp();
            alert('Expense deleted');
        }
    };
    
    // Delete closing
    window.deleteClosing = async (id) => {
        if (!isSuperAdmin()) return alert('Only Super Admin can delete');
        if (confirm('Delete record?')) {
            await apiCall(`/api/closings/${id}`, 'DELETE');
            await loadData();
            renderApp();
            alert('Record deleted');
        }
    };
    
    // Delete user
    window.deleteUser = async (id) => {
        if (!isSuperAdmin()) return alert('Only Super Admin can delete');
        const user = users.find(u => u.id === id);
        if (user?.username === 'superadmin') return alert('Cannot delete Super Admin');
        if (confirm('Delete user?')) {
            await apiCall(`/api/users/${id}`, 'DELETE');
            await loadData();
            renderApp();
            alert('User deleted');
        }
    };
    
    // Reset all data
    window.resetAllData = async () => {
        if (!isSuperAdmin()) return alert('Only Super Admin can reset');
        if (confirm('WARNING: This will delete ALL data! This cannot be undone!')) {
            await apiCall('/api/reset-all', 'POST');
            await loadData();
            renderApp();
            alert('All data reset to zero!');
        }
    };
    
    function renderDashboard() {
        const todayTotal = (currentDaySales?.cashAmount || 0) + (currentDaySales?.mpesaAmount || 0);
        const totalStock = inventory.reduce((sum, i) => sum + i.stockKg, 0);
        const totalValue = inventory.reduce((sum, i) => sum + (i.stockKg * i.priceKg), 0);
        
        return `
            <div class="stats-grid">
                <div class="stat-card"><h3>Today's Sales</h3><div class="stat-value">KES ${todayTotal.toLocaleString()}</div><small>${currentDaySales?.totalKg || 0} kg</small></div>
                <div class="stat-card"><h3>Total Stock</h3><div class="stat-value">${totalStock} kg</div></div>
                <div class="stat-card"><h3>Inventory Value</h3><div class="stat-value">KES ${totalValue.toLocaleString()}</div></div>
                <div class="stat-card"><h3>Products</h3><div class="stat-value">${inventory.length}</div></div>
            </div>
            <div class="card"><div class="card-header"><h3>📦 Current Inventory</h3></div>
            <table><thead><tr><th>Product</th><th>Stock</th><th>Price</th><th>Status</th></tr></thead><tbody>
                ${inventory.slice(0,5).map(i => `<tr><td>${i.name}</td><td>${i.stockKg} kg</td><td>KES ${i.priceKg}</td><td>${i.stockKg <= i.lowStockAlert ? '⚠️ Low' : '✓ OK'}</td></tr>`).join('')}
            </tbody></table></div>
            <div class="card"><div class="card-header"><h3>📋 Recent Activity</h3></div>
            <table><thead><tr><th>Time</th><th>User</th><th>Action</th></tr></thead><tbody>
                ${activityLogs.slice(0,5).map(l => `<tr><td>${l.timestamp}</td><td>${l.user}</td><td>${l.action}</td></tr>`).join('')}
            </tbody></table></div>
        `;
    }
    
    function renderInventory() {
        return `
            <div class="card">
                <div class="card-header">
                    <h3>📦 Inventory Management</h3>
                    ${isSuperAdmin() ? '<button class="btn btn-success btn-sm" onclick="addProduct()">+ Add Product</button>' : ''}
                </div>
                <table>
                    <thead><tr><th>Name</th><th>Animal</th><th>Stock (kg)</th><th>Price/kg</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${inventory.map(p => `
                            <tr>
                                <td>${p.name}</td>
                                <td>${p.animal}</td>
                                <td>${p.stockKg}</td>
                                <td>KES ${p.priceKg}</td>
                                <td>${p.stockKg <= p.lowStockAlert ? '⚠️ Low Stock' : '✓ In Stock'}</td>
                                <td>
                                    <button class="btn btn-sm" style="background:#3b82f6;" onclick="editStock(${p.id})">Edit Stock</button>
                                    ${isSuperAdmin() ? `<button class="btn btn-sm" style="background:#ef4444;" onclick="deleteProduct(${p.id})">Delete</button>` : ''}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    }
    
    function renderSales() {
        return `
            <div class="stats-grid">
                <div class="stat-card"><h3>Total KG</h3><div class="stat-value">${currentDaySales?.totalKg || 0} kg</div></div>
                <div class="stat-card"><h3>Cash</h3><div class="stat-value">KES ${(currentDaySales?.cashAmount || 0).toLocaleString()}</div></div>
                <div class="stat-card"><h3>M-Pesa</h3><div class="stat-value">KES ${(currentDaySales?.mpesaAmount || 0).toLocaleString()}</div></div>
            </div>
            <div class="card">
                <div class="form-group"><label>🥩 Kilograms Sold</label><input type="number" id="saleKg" step="0.1" placeholder="Enter kg"></div>
                <div class="form-group"><label>💵 Cash Amount</label><input type="number" id="saleCash" placeholder="Enter cash"></div>
                <div class="form-group"><label>📲 M-Pesa Amount</label><input type="number" id="saleMpesa" placeholder="Enter M-Pesa"></div>
                <button class="btn btn-success" onclick="addSale()">Add Sale</button>
                <button class="btn btn-warning" onclick="closeDay()">Close Day</button>
                <button class="btn" onclick="newDay()">Start New Day</button>
                <div style="margin-top:15px; padding:10px; background:#e0f2fe; border-radius:8px;">
                    Date: ${currentDaySales?.date} | Status: ${currentDaySales?.isClosed ? '🔒 Closed' : '🟢 Open'}
                </div>
            </div>
        `;
    }
    
    function renderExpenses() {
        return `
            <div class="card">
                <div class="form-group"><label>Category</label><input id="expCategory" placeholder="e.g., Transport"></div>
                <div class="form-group"><label>Amount (KES)</label><input type="number" id="expAmount"></div>
                <button class="btn btn-success" onclick="addExpense()">Add Expense</button>
            </div>
            <div class="card">
                <h3>Expense History</h3>
                <table><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Action</th></tr></thead><tbody>
                    ${expenses.map(e => `
                        <tr>
                            <td>${e.date}</td>
                            <td>${e.category}</td>
                            <td>KES ${e.amount.toLocaleString()}</td>
                            <td>${isSuperAdmin() ? `<button class="btn btn-sm" style="background:#ef4444;" onclick="deleteExpense(${e.id})">Delete</button>` : 'View'}</td>
                        </tr>
                    `).join('')}
                </tbody></table>
            </div>
        `;
    }
    
    function renderReports() {
        const totalRevenue = dailyClosings.reduce((sum, r) => sum + r.totalRevenue, 0);
        const totalKg = dailyClosings.reduce((sum, r) => sum + r.totalKg, 0);
        
        return `
            <div class="stats-grid">
                <div class="stat-card"><h3>Total Revenue</h3><div class="stat-value">KES ${totalRevenue.toLocaleString()}</div></div>
                <div class="stat-card"><h3>Total KG Sold</h3><div class="stat-value">${totalKg} kg</div></div>
                <div class="stat-card"><h3>Days Closed</h3><div class="stat-value">${dailyClosings.length}</div></div>
            </div>
            <div class="card">
                <table><thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total</th><th>Closed By</th>${isSuperAdmin() ? '<th>Action</th>' : ''}</tr></thead><tbody>
                    ${dailyClosings.map(r => `
                        <tr>
                            <td>${r.date}</td>
                            <td>${r.totalKg}</td>
                            <td>KES ${r.cashAmount.toLocaleString()}</td>
                            <td>KES ${r.mpesaAmount.toLocaleString()}</td>
                            <td><strong>KES ${r.totalRevenue.toLocaleString()}</strong></td>
                            <td>${r.closedBy}</td>
                            ${isSuperAdmin() ? `<td><button class="btn btn-sm" style="background:#ef4444;" onclick="deleteClosing(${r.id})">Delete</button></td>` : ''}
                        </tr>
                    `).join('')}
                </tbody></table>
            </div>
        `;
    }
    
    function renderUsers() {
        return `
            <div class="card">
                <div class="card-header">
                    <h3>👥 User Management</h3>
                    <button class="btn btn-success btn-sm" onclick="showAddUser()">+ Add User</button>
                </div>
                <table><thead><tr><th>Full Name</th><th>Username</th><th>Password</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>
                    ${users.map(u => `
                        <tr>
                            <td>${u.fullName}</td>
                            <td>${u.username}</td>
                            <td>
                                ${visiblePasswords[u.id] && isSuperAdmin() ? u.password : '••••••'}
                                ${isSuperAdmin() ? `<i class="fas ${visiblePasswords[u.id] ? 'fa-eye-slash' : 'fa-eye'} eye-icon" onclick="togglePassword(${u.id})"></i>` : ''}
                            </td>
                            <td>${u.role === 'super_admin' ? '👑 Super Admin' : '👤 Admin'}</td>
                            <td>${u.isActive ? '✅ Active' : '❌ Inactive'}</td>
                            <td>${u.lastLogin || 'Never'}</td>
                            <td>${u.username !== 'superadmin' ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>` : 'Protected'}</td>
                        </tr>
                    `).join('')}
                </tbody></table>
            </div>
        `;
    }
    
    function renderLogs() {
        return `
            <div class="card">
                <h3>📋 Activity Logs</h3>
                <table><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>
                    ${activityLogs.slice(0, 100).map(l => `
                        <tr>
                            <td>${l.timestamp}</td>
                            <td>${l.user}</td>
                            <td>${l.userRole}</td>
                            <td>${l.action}</td>
                            <td>${l.details || '-'}</td>
                        </tr>
                    `).join('')}
                </tbody></table>
            </div>
        `;
    }
    
    async function renderApp() {
        const app = document.getElementById('app');
        
        if (!token || !currentUser) {
            app.innerHTML = `
                <div class="login-container">
                    <i class="fas fa-drumstick-bite" style="font-size:48px; color:#3b82f6;"></i>
                    <h2 style="margin:20px 0;">Bismillah Butchery Pro</h2>
                    <div class="form-group"><label>Username</label><input type="text" id="username" placeholder="Enter username"></div>
                    <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter password"></div>
                    <button class="btn" style="width:100%;" onclick="login()">Login</button>
                    <p style="margin-top:15px; font-size:12px;">Demo: superadmin / admin123</p>
                </div>
            `;
            return;
        }
        
        const navItems = [
            { id: 'dashboard', icon: '📊', name: 'Dashboard' },
            { id: 'sales', icon: '💰', name: 'Today\'s Sales' },
            { id: 'inventory', icon: '📦', name: 'Inventory' },
            { id: 'expenses', icon: '📝', name: 'Expenses' },
            { id: 'reports', icon: '📈', name: 'Reports' }
        ];
        if (isSuperAdmin()) navItems.push({ id: 'users', icon: '👥', name: 'Users' });
        if (isSuperAdmin()) navItems.push({ id: 'logs', icon: '📋', name: 'Activity Logs' });
        
        let content = '';
        if (currentPage === 'dashboard') content = renderDashboard();
        else if (currentPage === 'inventory') content = renderInventory();
        else if (currentPage === 'sales') content = renderSales();
        else if (currentPage === 'expenses') content = renderExpenses();
        else if (currentPage === 'reports') content = renderReports();
        else if (currentPage === 'users') content = renderUsers();
        else if (currentPage === 'logs') content = renderLogs();
        
        app.innerHTML = `
            <div class="dashboard-container">
                <div class="sidebar">
                    <h2>🐄 Bismillah</h2>
                    ${navItems.map(item => `
                        <div class="nav-item ${currentPage === item.id ? 'active' : ''}" onclick="setPage('${item.id}')">
                            ${item.icon} ${item.name}
                        </div>
                    `).join('')}
                    ${isSuperAdmin() ? `<div class="nav-item" onclick="resetAllData()" style="color:#ef4444; margin-top:20px;">🗑️ Reset All Data</div>` : ''}
                </div>
                <div class="main-content">
                    <div class="top-bar">
                        <div>
                            <strong>${currentUser.fullName}</strong>
                            <span style="margin-left:10px; padding:4px 8px; background:#e2e8f0; border-radius:20px; font-size:12px;">${isSuperAdmin() ? 'Super Admin' : 'Admin'}</span>
                        </div>
                        <button class="btn btn-sm" style="background:#64748b;" onclick="logout()">Logout</button>
                    </div>
                    ${content}
                </div>
            </div>
        `;
    }
    
    window.setPage = (page) => {
        currentPage = page;
        renderApp();
    };
    
    // Initialize
    (async () => {
        const savedToken = localStorage.getItem('token');
        if (savedToken) {
            token = savedToken;
            const me = await apiCall('/api/me');
            if (me) {
                currentUser = me;
                await loadData();
            } else {
                token = null;
                localStorage.removeItem('token');
            }
        }
        renderApp();
    })();
</script>
