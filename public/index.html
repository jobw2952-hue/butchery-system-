    <style>

        .reset-confirm-box { background: white; border-radius: 20px; padding: 30px; max-width: 400px; text-align: center; }
        .reset-confirm-box button { margin: 10px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }

        @media (max-width: 768px) { .dashboard-layout { flex-direction: column; } .sidebar { width: 100%; position: relative; } }

<body>
<div id="app"><div class="loading"><div class="spinner"></div><p>Connecting to server...</p></div></div>
<div class="version-badge" onclick="showVersionInfo()">v8.2.0 📊 Profit Dashboard</div>

<script>
    // ========== BISMILAH BUTCHERY PRO - WITH PROFIT TRACKING ==========
    
    function roundToTwo(num) {
        if (isNaN(num) || num === null || num === undefined) return 0;
        return Math.round(num * 1000) / 1000;
    }
    
    function roundCurrency(num) {
        if (isNaN(num) || num === null || num === undefined) return 0;
        return Math.round(num * 100) / 100;
    }
    
    function formatLocalTime(utcTimestamp) {
        if (!utcTimestamp) return '-';
        try {
            const date = new Date(utcTimestamp);
            return date.toLocaleString('en-KE', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        } catch (e) {
            return utcTimestamp;
        }
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return '-';
        try {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-KE', {
                year: 'numeric',
                month: 'short',
                day: '2-digit'
            });
        } catch (e) {
            return dateStr;
        }
    }
    
    const API_URL = '';
    let token = localStorage.getItem('token');
    let currentUser = null;
    let currentPage = 'dashboard';
    let showCreateAccount = false;
    let selectedReport = 'daily';
    let reportStartDate = '';
    let reportEndDate = '';
    let loginPasswordVisible = false;
    let visiblePasswords = {};
    let revenueChart = null;
    let profitChart = null;
    let selectedSalesDate = new Date().toISOString().split('T')[0];
    let timeFilter = 'all';
    
    let users = [];
    let inventory = [];
    let dailyClosings = [];
    let currentDaySales = { date: '', totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false, salesByProduct: {}, pendingDeductions: {} };
    let expenses = [];
    let activityLogs = [];
    
    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        try {
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('token');
                token = null;
                currentUser = null;
                renderApp();
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            return null;
        }
    }
    
    async function loadAllData() {
        if (!token) return;
        
        const [usersData, invData, closingsData, salesData, expensesData, logsData] = await Promise.all([
            apiCall('/api/users'),
            apiCall('/api/inventory'),
            apiCall('/api/closings'),
            apiCall('/api/current-sales'),
            apiCall('/api/expenses'),
            apiCall('/api/logs')
        ]);
        
        users = usersData || [];
        inventory = invData || [];
        dailyClosings = closingsData || [];
        currentDaySales = salesData || { date: new Date().toISOString().split('T')[0], totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false, salesByProduct: {}, pendingDeductions: {} };
        expenses = expensesData || [];
        activityLogs = logsData || [];
    }
    
    async function loadSalesForDate(date) {
        if (!token) return;
        
        const salesData = await apiCall(`/api/sales-by-date?date=${date}`);
        if (salesData) {
            currentDaySales = salesData;
            if (!currentDaySales.pendingDeductions) {
                currentDaySales.pendingDeductions = {};
            }
            renderApp();
        }
    }
    
    async function login(username, password) {
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.token) {
                token = data.token;
                currentUser = data.user;
                localStorage.setItem('token', token);
                await loadAllData();
                renderApp();
                return true;
            } else {
                alert(data.error || 'Invalid credentials!\n\nSuper Admin: superadmin / admin123\nAdmin: admin1 / admin123');
                return false;
            }
        } catch (error) {
            alert('Cannot connect to server. Please refresh the page and try again.');
            return false;
        }
    }
    
    function logout() {
        localStorage.removeItem('token');
        token = null;
        currentUser = null;
        renderApp();
    }
    
    function isSuperAdmin() { return currentUser?.role === 'super_admin'; }
    function canManageUsers() { return isSuperAdmin(); }
    function canViewLogs() { return isSuperAdmin(); }
    function canDelete() { return isSuperAdmin(); }
    
    function setPage(page) { currentPage = page; renderApp(); }
    
    window.setTimeFilter = (filter) => {
        timeFilter = filter;
        renderApp();
    };
    
    window.changeSalesDate = async () => {
        const datePicker = document.getElementById('salesDatePicker');
        if (datePicker) {
            selectedSalesDate = datePicker.value;
            
            const closing = dailyClosings.find(c => c.date === selectedSalesDate);
            
            if (closing) {
                await loadSalesForDate(selectedSalesDate);
                renderApp();
            } else {
                await apiCall('/api/new-day', 'POST', { date: selectedSalesDate });
                await loadSalesForDate(selectedSalesDate);
                renderApp();
            }
        }
    };
    
    window.autoCalculateKg = () => {
        const productSelect = document.getElementById('saleProduct');
        const selectedProductId = productSelect?.value;
        const cashAmount = parseFloat(document.getElementById('dailyCash')?.value) || 0;
        const mpesaAmount = parseFloat(document.getElementById('dailyMpesa')?.value) || 0;
        const totalAmount = cashAmount + mpesaAmount;
        
        if (!selectedProductId || selectedProductId === '' || totalAmount <= 0) {
            return;
        }
        
        const product = inventory.find(p => p.id == selectedProductId);
        if (product && product.priceKg > 0) {
            const calculatedKg = totalAmount / product.priceKg;
            const kgInput = document.getElementById('dailyKg');
            if (kgInput) {
                kgInput.value = roundToTwo(calculatedKg).toFixed(2);
            }
        }
    };
    
    window.onProductChange = () => {
        const kgInput = document.getElementById('dailyKg');
        if (kgInput) kgInput.value = '';
        autoCalculateKg();
    };
    
    window.deleteSaleEntry = async (productName, kg) => {
        if (!confirm(`Delete sale: ${kg}kg of ${productName}? This will remove the pending deduction.`)) {
            return;
        }
        
        const result = await apiCall('/api/delete-sale', 'POST', { 
            productName, 
            kg: parseFloat(kg),
            date: selectedSalesDate
        });
        
        if (result) {
            await loadSalesForDate(selectedSalesDate);
            await loadAllData();
            renderApp();
            alert(`✅ Sale entry deleted! Pending deduction removed for ${productName}.`);
        } else {
            alert('Failed to delete sale entry.');
        }
    };
    
    window.exportToExcel = () => {
        const filtered = getFilteredClosings();
        if (filtered.length === 0) {
            alert('No data to export');
            return;
        }
        
        const data = filtered.map(r => {
            let dayProfit = 0;
            let dayCost = 0;
            if (r.salesByProduct) {
                for (const [productName, kgSold] of Object.entries(r.salesByProduct)) {
                    const product = inventory.find(p => p.name === productName);
                    if (product) {
                        const revenue = kgSold * (product.priceKg || 0);
                        const cost = kgSold * (product.costKg || 0);
                        dayProfit += (revenue - cost);
                        dayCost += cost;
                    }
                }
            }
            dayProfit = Math.round(dayProfit * 100) / 100;
            dayCost = Math.round(dayCost * 100) / 100;
            return {
                'Date': r.date,
                'Total KG': roundToTwo(r.totalKg),
                'Revenue': roundCurrency(r.totalRevenue),
                'Cost of Goods Sold': roundCurrency(dayCost),
                'Gross Profit': roundCurrency(dayProfit),
                'Cash': roundCurrency(r.cashAmount),
                'M-Pesa': roundCurrency(r.mpesaAmount),
                'Closed By': r.closedBy
            };
        });
        
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Sales Report');
        XLSX.writeFile(wb, `butchery_report_${new Date().toISOString().split('T')[0]}.xlsx`);
        alert('✅ Report exported to Excel!');
    };
    
    window.exportToPDF = () => {
        const filtered = getFilteredClosings();
        if (filtered.length === 0) {
            alert('No data to export');
            return;
        }
        
        let totalCost = 0;
        let totalProfit = 0;
        for (const closing of filtered) {
            if (closing.salesByProduct) {
                for (const [productName, kgSold] of Object.entries(closing.salesByProduct)) {
                    const product = inventory.find(p => p.name === productName);
                    if (product) {
                        const revenue = kgSold * (product.priceKg || 0);
                        const cost = kgSold * (product.costKg || 0);
                        totalProfit += (revenue - cost);
                        totalCost += cost;
                    }
                }
            }
        }
        totalProfit = Math.round(totalProfit * 100) / 100;
        totalCost = Math.round(totalCost * 100) / 100;
        
        const totalRevenue = filtered.reduce((sum, r) => sum + r.totalRevenue, 0);
        const totalKg = filtered.reduce((sum, r) => sum + r.totalKg, 0);
        const totalExpenses = expenses.filter(e => {
            const expenseDate = new Date(e.date);
            const start = reportStartDate ? new Date(reportStartDate) : null;
            const end = reportEndDate ? new Date(reportEndDate) : null;
            if (start && expenseDate < start) return false;
            if (end && expenseDate > end) return false;
            return true;
        }).reduce((sum, e) => sum + e.amount, 0);
        const netProfit = totalProfit - totalExpenses;
        
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Butchery Sales Report</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; }
                    h1 { color: #1e293b; text-align: center; }
                    .summary { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
                    .summary-box { background: #f1f5f9; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
                    .summary-box h3 { margin-bottom: 5px; }
                    .summary-box .value { font-size: 24px; font-weight: bold; color: #3b82f6; }
                    .profit { color: #10b981; }
                    .loss { color: #ef4444; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                    th { background: #f8fafc; }
                    @media print {
                        .no-print { display: none; }
                    }
                </style>
            </head>
            <body>
                <h1>Bismillah Butchery Pro - Sales Report</h1>
                <p>Period: ${reportStartDate || 'Start'} to ${reportEndDate || 'End'}</p>
                <div class="summary">
                    <div class="summary-box"><h3>Total Revenue</h3><div class="value">KES ${roundCurrency(totalRevenue).toLocaleString()}</div></div>
                    <div class="summary-box"><h3>Total KG Sold</h3><div class="value">${roundToTwo(totalKg)} kg</div></div>
                    <div class="summary-box"><h3>Cost of Goods Sold</h3><div class="value">KES ${roundCurrency(totalCost).toLocaleString()}</div></div>
                    <div class="summary-box ${totalProfit >= 0 ? 'profit' : 'loss'}"><h3>Gross Profit</h3><div class="value">KES ${roundCurrency(totalProfit).toLocaleString()}</div></div>
                </div>
                <div class="summary">
                    <div class="summary-box"><h3>Total Expenses</h3><div class="value">KES ${roundCurrency(totalExpenses).toLocaleString()}</div></div>
                    <div class="summary-box ${netProfit >= 0 ? 'profit' : 'loss'}"><h3>Net Profit</h3><div class="value">KES ${roundCurrency(netProfit).toLocaleString()}</div></div>
                </div>
                <table>
                    <thead><tr><th>Date</th><th>KG</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Closed By</th></tr></thead>
                    <tbody>
                        ${filtered.map(r => {
                            let dayProfit = 0;
                            let dayCost = 0;
                            if (r.salesByProduct) {
                                for (const [productName, kgSold] of Object.entries(r.salesByProduct)) {
                                    const product = inventory.find(p => p.name === productName);
                                    if (product) {
                                        const revenue = kgSold * (product.priceKg || 0);
                                        const cost = kgSold * (product.costKg || 0);
                                        dayProfit += (revenue - cost);
                                        dayCost += cost;
                                    }
                                }
                            }
                            dayProfit = Math.round(dayProfit * 100) / 100;
                            dayCost = Math.round(dayCost * 100) / 100;
                            return `<tr><td style="padding:8px">${r.date}</td><td style="padding:8px">${roundToTwo(r.totalKg)}</td><td style="padding:8px">KES ${roundCurrency(r.totalRevenue).toLocaleString()}</td><td style="padding:8px">KES ${roundCurrency(dayCost).toLocaleString()}</td><td style="padding:8px">KES ${roundCurrency(dayProfit).toLocaleString()}</td><td style="padding:8px">${r.closedBy}</td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <p style="margin-top: 20px; text-align: center;">Generated on ${new Date().toLocaleString()}</p>
                <button onclick="window.print()" style="margin-top: 20px; padding: 10px 20px; background: #3b82f6; color: white; border: none; border-radius: 5px; cursor: pointer;">Print / Save as PDF</button>
            </body>
            </html>
        `);
        printWindow.document.close();
    };
    
    function getFilteredClosings() {
        let filtered = [...dailyClosings];
        
        if (reportStartDate) {
            const start = new Date(reportStartDate);
            filtered = filtered.filter(r => new Date(r.date) >= start);
        }
        if (reportEndDate) {
            const end = new Date(reportEndDate);
            end.setHours(23, 59, 59);
            filtered = filtered.filter(r => new Date(r.date) <= end);
        }
        
        if (selectedReport === 'daily') {
            filtered = filtered.slice(0, 7);
        }
        
        return filtered;
    }
    
    window.updateDateRange = () => {
        const startDate = document.getElementById('reportStartDate')?.value;
        const endDate = document.getElementById('reportEndDate')?.value;
        reportStartDate = startDate || '';
        reportEndDate = endDate || '';
        renderApp();
    };
    
    window.resetDateRange = () => {
        document.getElementById('reportStartDate').value = '';
        document.getElementById('reportEndDate').value = '';
        reportStartDate = '';
        reportEndDate = '';
        renderApp();
    };
    
    window.changeReport = (value) => { 
        selectedReport = value; 
        renderApp();
    };
    
    window.updateDailySales = async () => {
        const productSelect = document.getElementById('saleProduct');
        const selectedProductId = productSelect?.value;
        const kg = parseFloat(document.getElementById('dailyKg')?.value);
        const cash = parseFloat(document.getElementById('dailyCash')?.value);
        const mpesa = parseFloat(document.getElementById('dailyMpesa')?.value);
        const saleDate = document.getElementById('salesDatePicker')?.value || new Date().toISOString().split('T')[0];
        
        const closing = dailyClosings.find(c => c.date === saleDate);
        if (closing) {
            alert(`❌ ${saleDate} is already CLOSED! You cannot add more sales.`);
            return;
        }
        
        if (!selectedProductId || selectedProductId === '') {
            alert('Please select a product');
            return;
        }
        if (isNaN(kg) || kg <= 0) return alert('Enter valid KG');
        if (isNaN(cash) || cash < 0) return alert('Enter valid Cash');
        if (isNaN(mpesa) || mpesa < 0) return alert('Enter valid M-Pesa');
        
        const product = inventory.find(p => p.id == selectedProductId);
        if (!product) return alert('Product not found');
        
        if (product.stockKg < kg) {
            if (!confirm(`⚠️ Warning: Only ${roundToTwo(product.stockKg)} kg available for ${product.name}. You are trying to sell ${kg}kg.\n\nThis may cause insufficient stock when closing the day.\n\nContinue anyway?`)) {
                return;
            }
        }
        
        const result = await apiCall('/api/current-sales', 'POST', { 
            productId: selectedProductId,
            productName: product.name,
            kg: roundToTwo(kg), 
            cash: roundCurrency(cash || 0), 
            mpesa: roundCurrency(mpesa || 0),
            date: saleDate,
            userName: currentUser?.fullName || 'System'
        });
        
        if (result) {
            await loadSalesForDate(saleDate);
            await loadAllData();
            renderApp();
            alert(`✅ Added ${roundToTwo(kg)}kg of ${product.name} on ${saleDate}!\n\n📌 Inventory will be deducted when you close the day.`);
            if (document.getElementById('dailyKg')) document.getElementById('dailyKg').value = '';
            if (document.getElementById('dailyCash')) document.getElementById('dailyCash').value = '';
            if (document.getElementById('dailyMpesa')) document.getElementById('dailyMpesa').value = '';
            if (document.getElementById('saleProduct')) document.getElementById('saleProduct').value = '';
        }
    };
    
    window.closeDay = async () => {
        const today = selectedSalesDate;
        
        const closing = dailyClosings.find(c => c.date === today);
        if (closing) {
            alert(`📅 ${today} is already CLOSED!`);
            return;
        }
        
        if (currentDaySales.isClosed) return alert('Already closed');
        if (currentDaySales.totalKg === 0 && currentDaySales.cashAmount === 0 && currentDaySales.mpesaAmount === 0) {
            return alert('No sales to close. Add at least one sale first.');
        }
        
        const total = currentDaySales.cashAmount + currentDaySales.mpesaAmount;
        const pendingDeductions = currentDaySales.pendingDeductions || {};
        
        let salesSummary = '\n\n📊 Sales Summary:';
        let pendingSummary = '\n\n⏳ Pending Deductions (will be deducted from inventory):';
        let hasPending = false;
        
        if (currentDaySales.salesByProduct) {
            for (const [product, kg] of Object.entries(currentDaySales.salesByProduct)) {
                const productInfo = inventory.find(p => p.name === product);
                const revenue = kg * (productInfo?.priceKg || 0);
                salesSummary += `\n- ${product}: ${roundToTwo(kg)} kg = KES ${roundCurrency(revenue).toLocaleString()}`;
            }
        }
        
        if (pendingDeductions) {
            for (const [product, kg] of Object.entries(pendingDeductions)) {
                const productInfo = inventory.find(p => p.name === product);
                const currentStock = productInfo?.stockKg || 0;
                const willBeShort = currentStock < kg;
                pendingSummary += `\n- ${product}: ${roundToTwo(kg)} kg (Current stock: ${roundToTwo(currentStock)} kg)${willBeShort ? ' ⚠️ INSUFFICIENT STOCK!' : ''}`;
                hasPending = true;
            }
        }
        
        if (!hasPending) {
            pendingSummary = '\n\n✅ No pending deductions.';
        }
        
        if (confirm(`🔒 CLOSE DAY: ${today}\n\n📦 Total KG: ${roundToTwo(currentDaySales.totalKg)} kg\n💰 Cash: KES ${roundCurrency(currentDaySales.cashAmount).toLocaleString()}\n📱 M-Pesa: KES ${roundCurrency(currentDaySales.mpesaAmount).toLocaleString()}\n💵 Total Revenue: KES ${roundCurrency(total).toLocaleString()}${salesSummary}${pendingSummary}\n\n⚠️ This will deduct all pending stock from inventory.\n\nDo you want to close this day?`)) {
            const result = await apiCall('/api/close-day', 'POST', { 
                date: today,
                closedBy: currentUser?.fullName || 'System'
            });
            if (result) {
                await loadSalesForDate(today);
                await loadAllData();
                renderApp();
                const message = result.allDeducted ? 
                    `✅ Day ${today} closed successfully!\n\nAll stock deducted from inventory.` :
                    `✅ Day ${today} closed!\n\n⚠️ Some products had insufficient stock. Please check inventory.`;
                alert(message);
            } else {
                alert('Failed to close day.');
            }
        }
    };
    
    window.addExpenseWithDate = async () => {
        const category = document.getElementById('expCategory')?.value;
        const amount = parseFloat(document.getElementById('expAmount')?.value);
        const description = document.getElementById('expDesc')?.value;
        const expenseDate = document.getElementById('expenseDate')?.value;
        
        if (!category || isNaN(amount) || amount <= 0) return alert('Enter valid expense');
        if (!expenseDate) return alert('Please select a date');
        
        const result = await apiCall('/api/expenses', 'POST', { 
            category, 
            amount: roundCurrency(amount), 
            description: description || '',
            date: expenseDate,
            userName: currentUser?.fullName || 'System'
        });
        
        if (result) {
            await loadAllData();
            renderApp();
            if (document.getElementById('expCategory')) document.getElementById('expCategory').value = '';
            if (document.getElementById('expAmount')) document.getElementById('expAmount').value = '';
            if (document.getElementById('expDesc')) document.getElementById('expDesc').value = '';
            if (document.getElementById('expenseDate')) document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
            alert('✅ Expense added');
        }
    };
    
    window.togglePasswordVisibility = (userId) => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can view passwords');
            return;
        }
        visiblePasswords[userId] = !visiblePasswords[userId];
        renderApp();
    };
    
    window.toggleLoginPassword = () => {
        loginPasswordVisible = !loginPasswordVisible;
        const input = document.getElementById('loginPasswordInput');
        if (input) input.type = loginPasswordVisible ? 'text' : 'password';
    };
    
    window.resetAllData = () => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can reset all data!');
            return;
        }
        
        const productCount = inventory.length;
        
        const modalHtml = `
            <div class="reset-confirm-modal" id="resetConfirmModal">
                <div class="reset-confirm-box">
                    <i class="fas fa-exclamation-triangle" style="font-size:48px; color:#ef4444; margin-bottom:20px;"></i>
                    <h3 style="margin-bottom:15px;">⚠️ WARNING: RESET SALES & EXPENSES</h3>
                    <p style="margin-bottom:20px; color:#64748b;">This will reset:</p>
                    <ul style="text-align:left; margin-bottom:20px; color:#64748b;">
                        <li>📊 All sales records</li>
                        <li>📅 All closed days</li>
                        <li>💸 All expenses</li>
                        <li>📋 All activity logs</li>
                        <li style="color:#10b981;"><strong>✅ ${productCount} product(s) will be KEPT</strong></li>
                    </ul>
                    <p style="color:#ef4444; margin-bottom:20px;"><strong>This action CANNOT be undone!</strong></p>
                    <button onclick="confirmReset()" style="background:#ef4444; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-right:10px;">Yes, Reset Sales</button>
                    <button onclick="closeResetModal()" style="background:#94a3b8; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">Cancel</button>
                </div>
            </div>
        `;
        const existing = document.getElementById('resetConfirmModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.confirmReset = async () => {
        closeResetModal();
        
        try {
            const response = await fetch('/api/reset-all', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (response.ok) {
                await loadAllData();
                renderApp();
                alert('✅ Sales, expenses, and logs have been reset! Inventory preserved.');
            } else {
                alert('Reset failed. Please try again.');
            }
        } catch (error) {
            alert('Error resetting data. Make sure server is running.');
        }
    };
    
    window.closeResetModal = () => {
        const modal = document.getElementById('resetConfirmModal');
        if (modal) modal.remove();
    };
    
    // ========== USER FUNCTIONS ==========
    window.showAddUserModal = () => {
        if (!isSuperAdmin()) {
            alert('Only Super Admin can add users');
            return;
        }
        
        const modalHtml = `
            <div class="modal" id="addUserModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-user-plus"></i> Add New User</h3>
                        <button class="close-modal" onclick="closeAddUserModal()">&times;</button>
                    </div>
                    <div class="form-group">
                        <label>Full Name *</label>
                        <input type="text" id="newUserFullName" placeholder="Enter full name">
                    </div>
                    <div class="form-group">
                        <label>Username *</label>
                        <input type="text" id="newUserUsername" placeholder="Enter username">
                    </div>
                    <div class="form-group">
                        <label>Password *</label>
                        <input type="password" id="newUserPassword" placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>Confirm Password *</label>
                        <input type="password" id="newUserConfirmPassword" placeholder="Confirm password">
                    </div>
                    <div class="form-group">
                        <label>Email (Optional)</label>
                        <input type="email" id="newUserEmail" placeholder="Enter email">

                    </div>

                        <label>Role</label>
                        <select id="newUserRole">
                            <option value="admin">Admin</option>
                            <option value="super_admin">Super Admin</option>
                        </select>
                    </div>
                    <div style="display:flex; gap:12px; margin-top:20px;">
                        <button class="btn btn-success" onclick="submitAddUser()" style="flex:1;">Create User</button>
                        <button class="btn-delete" onclick="closeAddUserModal()" style="flex:1;">Cancel</button>
                    </div>

            </div>
        `;
        const existing = document.getElementById('addUserModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.closeAddUserModal = () => {
        const modal = document.getElementById('addUserModal');
        if (modal) modal.remove();
    };
    
    window.submitAddUser = async () => {
        const fullName = document.getElementById('newUserFullName')?.value;
        const username = document.getElementById('newUserUsername')?.value;
        const password = document.getElementById('newUserPassword')?.value;
        const confirmPassword = document.getElementById('newUserConfirmPassword')?.value;
        const email = document.getElementById('newUserEmail')?.value;
        const phone = document.getElementById('newUserPhone')?.value;
        const role = document.getElementById('newUserRole')?.value;
        
        if (!fullName || !username || !password) {
            alert('Please fill all required fields (Full Name, Username, Password)');
            return;
        }
        
        if (password !== confirmPassword) {
            alert('Passwords do not match!');
            return;
        }
        
        if (password.length < 4) {
            alert('Password must be at least 4 characters');
            return;
        }
        
        const result = await apiCall('/api/users', 'POST', {
            username,
            password,
            fullName,
            role: role || 'admin',
            email: email || '',
            phone: phone || ''
        });
        
        if (result) {
            closeAddUserModal();
            await loadAllData();
            renderApp();
            alert(`✅ User "${username}" created successfully!`);
        } else {
            alert('Username already exists!');
        }
    };
    
    window.deleteUser = async (userId) => {
        if (!canManageUsers()) return alert('Only Super Admin can delete users');
        const user = users.find(u => u.id === userId);
        if (!user) return;
        if (user.username === 'superadmin') { alert('Cannot delete Super Admin!'); return; }
        if (user.id === currentUser?.id) { alert('Cannot delete your own account!'); return; }
        if (confirm(`Delete ${user.fullName}?`)) {
            const result = await apiCall(`/api/users/${userId}`, 'DELETE');
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ User deleted');
            }
        }
    };
    
    window.openEditUserModal = async (userId) => {
        if (!canManageUsers()) return alert('Only Super Admin can manage users');
        const user = users.find(u => u.id === userId);
        if (!user) return;
        
        const newFullName = prompt('Enter new full name:', user.fullName);
        if (newFullName && newFullName !== user.fullName) {
            const result = await apiCall(`/api/users/${userId}`, 'PUT', { fullName: newFullName });
            if (result) {
                await loadAllData();
                renderApp();
                alert('✅ User updated');
            }
        }
    };
    
    // ========== PRODUCT FUNCTIONS ==========

        if (!isSuperAdmin()) return alert('Only Super Admin can add products');
        
        const today = new Date().toISOString().split('T')[0];

            <div class="modal" id="addProductModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-plus-circle"></i> Add New Product</h3>

    window.closeAddProductModal = () => {
        const modal = document.getElementById('addProductModal');
        if (modal) modal.remove();
    };
    
    window.submitAddProduct = async () => {
        const name = document.getElementById('addName')?.value;
        const animal = document.getElementById('addAnimal')?.value;
        const stockKg = parseFloat(document.getElementById('addStock')?.value);
        const priceKg = parseFloat(document.getElementById('addPrice')?.value);
        let costKg = parseFloat(document.getElementById('addCost')?.value);
        const lowStockAlert = parseFloat(document.getElementById('addAlert')?.value) || 10;
        const restockDate = document.getElementById('addRestockDate')?.value || new Date().toISOString().split('T')[0];
        
        if (!name || isNaN(stockKg) || isNaN(priceKg)) {
            alert('Please fill all required fields (Name, Stock, Price)');
            return;
        }
        
        if (isNaN(costKg)) costKg = priceKg * 0.7;
        
        const result = await apiCall('/api/inventory', 'POST', {
            name, 
            animal, 
            stockKg: roundToTwo(stockKg), 
            priceKg: roundCurrency(priceKg), 
            costKg: roundCurrency(costKg), 
            lowStockAlert,
            restockDate: restockDate,
            userName: currentUser?.fullName || 'System'
        });
        
        if (result) {
            closeAddProductModal();
            await loadAllData();
            renderApp();
            alert(`✅ Product "${name}" added successfully!`);
        } else {
            alert('Failed to add product. Please try again.');
        }
    };
    
    window.openRestockModal = async (productId) => {
        const product = inventory.find(p => p.id === productId);
        if (!product) return;
        
        const today = new Date().toISOString().split('T')[0];
        const currentStock = product.stockKg || 0;
        
        const modalHtml = `
            <div class="modal" id="restockModal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3><i class="fas fa-boxes"></i> Restock: ${product.name}</h3>
                        <button class="close-modal" onclick="closeRestockModal()">&times;</button>
                    </div>
                    <div class="alert-info" style="margin-bottom:15px; background:#dbeafe; color:#1e40af; border-left:4px solid #3b82f6;">
                        <i class="fas fa-info-circle"></i> 
                        <strong>Current stock:</strong> ${roundToTwo(currentStock)} kg<br>
                        Enter the amount of <strong>NEW stock</strong> to ADD to existing stock.
                    </div>
                    <div class="form-group" style="background:#f0fdf4; padding:12px; border-radius:10px; border:1px solid #d1fae5;">
                        <label style="color:#065f46;">📦 Add Stock (kg) *</label>
                        <input type="number" id="restockAddStock" step="0.1" placeholder="Enter kg to add" value="" style="border-color:#10b981;">
                        <div class="calc-note" style="color:#065f46;">
                            <i class="fas fa-calculator"></i> 
                            This will be <strong>ADDED</strong> to current stock of ${roundToTwo(currentStock)} kg 
                            → New total will be <strong id="restockNewTotal">${roundToTwo(currentStock)} kg</strong>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>📅 Restock Date</label>
                        <input type="date" id="restockDate" value="${today}">
                    </div>
                    <div style="display:flex; gap:12px; margin-top:20px;">
                        <button class="btn btn-success" onclick="submitRestock(${product.id})" style="flex:1; background:#10b981;">
                            <i class="fas fa-plus-circle"></i> Add Stock
                        </button>
                        <button class="btn-delete" onclick="closeRestockModal()" style="flex:1;">Cancel</button>
                    </div>
                </div>
            </div>
        `;
        const existing = document.getElementById('restockModal');
        if (existing) existing.remove();
        document.body.insertAdjacentHTML('beforeend', modalHtml);
        
        const stockInput = document.getElementById('restockAddStock');
        if (stockInput) {
            const currentStockValue = currentStock;
            stockInput.addEventListener('input', function() {
                const added = parseFloat(this.value) || 0;

    function renderDashboard() {
        const totalInventoryValue = inventory.reduce((sum, i) => sum + (i.stockKg * i.costKg), 0);
        const todayTotal = (currentDaySales.cashAmount || 0) + (currentDaySales.mpesaAmount || 0);
        const lowStock = inventory.filter(i => i.stockKg <= i.lowStockAlert).length;
        
        // Calculate 7-day revenue and profit from closed days
        const sevenDaysAgo = new Date();
        sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
        
        const sevenDaySales = dailyClosings.filter(r => new Date(r.date) >= sevenDaysAgo);
        const sevenDayRevenue = sevenDaySales.reduce((sum, r) => sum + (r.totalRevenue || 0), 0);
        
        // Calculate 7-day profit (Revenue - Cost of Goods Sold)
        let sevenDayProfit = 0;
        let totalCost = 0;
        for (const closing of sevenDaySales) {
            if (closing.salesByProduct) {
                for (const [productName, kgSold] of Object.entries(closing.salesByProduct)) {
                    const product = inventory.find(p => p.name === productName);
                    if (product) {
                        const revenue = kgSold * (product.priceKg || 0);
                        const cost = kgSold * (product.costKg || 0);
                        sevenDayProfit += (revenue - cost);
                        totalCost += cost;
                    }
                }
            }
        }
        sevenDayProfit = Math.round(sevenDayProfit * 100) / 100;
        const profitMargin = sevenDayRevenue > 0 ? ((sevenDayProfit / sevenDayRevenue) * 100).toFixed(1) : 0;
        
        // If no closed days, show a message
        const hasData = sevenDaySales.length > 0;
        const profitClass = hasData ? (sevenDayProfit >= 0 ? 'profit-card' : 'loss-card') : '';
        
        return `<div class="stats-grid">
            <div class="stat-card"><div class="stat-title">Today's Sales</div><div class="stat-value">KES ${roundCurrency(todayTotal).toLocaleString()}</div><div class="stat-change">${roundToTwo(currentDaySales.totalKg)} kg sold today</div></div>

        }
        
        return `<div class="sales-panel">
            <div class="sales-card"><h3>📦 Total KG</h3><div class="amount">${roundToTwo(currentDaySales.totalKg)} kg</div></div>
            <div class="sales-card"><h3>💰 Cash</h3><div class="amount">KES ${roundCurrency(currentDaySales.cashAmount).toLocaleString()}</div></div>
            <div class="sales-card"><h3>📱 M-Pesa</h3><div class="amount">KES ${roundCurrency(currentDaySales.mpesaAmount).toLocaleString()}</div></div>
        </div>
        
        <div class="card">
            <div class="card-header"><h2>📅 Select Date & Record Sale</h2></div>
            <div class="date-selector">
                <label><i class="fas fa-calendar-alt"></i> Sale Date:</label>
                <input type="date" id="salesDatePicker" value="${selectedSalesDate}" onchange="changeSalesDate()">
                <span class="alert-info" style="margin:0; padding:5px 10px;">Status: ${statusText}</span>
                ${isClosedPermanently ? '<span style="color:#ef4444; margin-left:10px;"><i class="fas fa-lock"></i> This day is CLOSED. View only.</span>' : '<span style="color:#10b981; margin-left:10px;"><i class="fas fa-check-circle"></i> Day is OPEN for sales</span>'}
            </div>
            ${isClosedPermanently ? `
            <div class="alert-info alert-closed">
                <i class="fas fa-info-circle"></i> 
                <strong>${selectedSalesDate} is CLOSED.</strong><br>
                You can view the sales below but cannot add more.
                ${hasSales ? ` Total: ${roundToTwo(currentDaySales.totalKg)} kg sold.` : ''}
            </div>
            ` : `
            <div class="alert-info alert-open">
                <i class="fas fa-info-circle"></i> 
                <strong>${selectedSalesDate} is OPEN.</strong><br>
                ${hasSales ? `You have ${Object.keys(currentDaySales.salesByProduct).length} product(s) added. Continue adding or close the day when done.` : 'No sales yet. Select a product and add below.'}
                ${hasPending ? ` ⏳ ${Object.keys(currentDaySales.pendingDeductions).length} pending deduction(s).` : ''}
            </div>
            `}
            
            ${!isClosedPermanently ? `
            <div class="form-group">
                <label>🥩 Select Product</label>
                <select id="saleProduct" class="product-select" onchange="onProductChange()">
                    <option value="">-- Select Product --</option>
                    ${productOptions}
                </select>
            </div>
            <div class="form-group">
                <label>💵 Cash Amount (KES)</label>
                <input type="number" id="dailyCash" placeholder="Enter cash amount" oninput="autoCalculateKg()">
            </div>
            <div class="form-group">
                <label>📲 M-Pesa Amount (KES)</label>
                <input type="number" id="dailyMpesa" placeholder="Enter M-Pesa amount" oninput="autoCalculateKg()">
            </div>
            <div class="form-group">
                <label>📦 Quantity Sold (kg) - Auto Calculated</label>
                <input type="number" id="dailyKg" step="0.1" placeholder="Auto-calculated" readonly style="background-color:#f3f4f6; cursor:not-allowed;">
                <div class="calc-note"><i class="fas fa-calculator"></i> KG is automatically calculated from Cash + M-Pesa divided by product price</div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-success" onclick="updateDailySales()"><i class="fas fa-plus-circle"></i> Add Sale</button>
                <button class="btn btn-warning" onclick="closeDay()"><i class="fas fa-lock"></i> Close Day</button>
            </div>
            <div class="calc-note" style="margin-top:10px; padding:8px; background:#dbeafe; border-radius:8px;">
                <i class="fas fa-info-circle"></i> <strong>Note:</strong> Inventory will be deducted only when you close the day.
            </div>
            ` : ''}
        </div>
        
        ${hasPending && !isClosedPermanently ? `
        <div class="card" style="background:#fef3c7; border-left:4px solid #f59e0b;">
            <div class="card-header">
                <h2><i class="fas fa-clock"></i> ⏳ Pending Deductions</h2>
                <span class="pending-badge">Will deduct when day is closed</span>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Quantity (kg)</th><th>Current Stock</th><th>Status</th></tr></thead>
                    <tbody>
                        ${Object.entries(currentDaySales.pendingDeductions).map(([product, kg]) => {
                            const productInfo = inventory.find(p => p.name === product);
                            const currentStock = productInfo?.stockKg || 0;
                            const willBeShort = currentStock < kg;
                            return `<tr>
                                <td style="padding:8px">${product}</td>
                                <td style="padding:8px">${roundToTwo(kg)} kg</td>
                                <td style="padding:8px">${roundToTwo(currentStock)} kg</td>
                                <td style="padding:8px">${willBeShort ? '<span style="color:#ef4444;">⚠️ Insufficient Stock!</span>' : '<span style="color:#10b981;">✅ Available</span>'}</td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
            <div class="calc-note" style="padding:10px; text-align:center; background:#fef3c7;">
                <i class="fas fa-info-circle"></i> Stock will be deducted when you close this day.
            </div>
        </div>
        ` : ''}
        
        ${hasSales ? `
        <div class="card">
            <div class="card-header">
                <h2>📊 Sales for ${selectedSalesDate}</h2>
                <span class="role-badge">${isClosedPermanently ? '🔒 CLOSED' : '🟢 OPEN'} • ${Object.keys(currentDaySales.salesByProduct).length} Product(s)</span>
            </div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Quantity (kg)</th><th>Price/kg</th><th>Revenue (KES)</th>${!isClosedPermanently ? '<th>Action</th>' : ''}</tr></thead>
                    <tbody>
                        ${Object.entries(currentDaySales.salesByProduct).map(([product, kg]) => {
                            const productInfo = inventory.find(p => p.name === product);
                            const pricePerKg = productInfo?.priceKg || 0;
                            const productRevenue = Math.round((kg * pricePerKg) * 100) / 100;
                            return `<tr>
                                <td style="padding:8px">${product}</td>
                                <td style="padding:8px">${roundToTwo(kg)} kg</td>
                                <td style="padding:8px">KES ${roundCurrency(pricePerKg)}</td>
                                <td style="padding:8px">KES ${roundCurrency(productRevenue).toLocaleString()}</td>
                                ${!isClosedPermanently ? `<td style="padding:8px"><button class="btn-delete" onclick="deleteSaleEntry('${product.replace(/'/g, "\\'")}', ${kg})">Delete</button></td>` : ''}
                            </tr>`;
                        }).join('')}
                        <tr style="background-color: #f0fdf4; font-weight: bold;">
                            <td colspan="3" style="text-align: right; padding: 12px;">TOTAL REVENUE:</td>
                            <td colspan="${isClosedPermanently ? '1' : '2'}" style="padding: 12px; color: #10b981;">
                                KES ${roundCurrency(totalRevenue).toLocaleString()}
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            ${isClosedPermanently ? `
            <div class="calc-note" style="padding:10px; text-align:center; background:#fef3c7; border-radius:8px; margin-top:10px;">
                <i class="fas fa-lock"></i> This day is CLOSED. No changes can be made.
            </div>
            ` : `
            <div class="calc-note" style="padding:10px; text-align:right;"><i class="fas fa-info-circle"></i> Revenue = Quantity × Price per kg</div>
            `}
        </div>
        ` : `
        <div class="alert-info"><i class="fas fa-info-circle"></i> No sales recorded for ${selectedSalesDate}. ${isClosedPermanently ? 'This day is closed.' : 'Select a product and add sale above.'}</div>
        `}`;
    }
    
    function renderReports() {
        let filtered = getFilteredClosings();
        
        const totalRevenue = filtered.reduce((sum, r) => sum + (r.totalRevenue || 0), 0);
        const totalKg = filtered.reduce((sum, r) => sum + (r.totalKg || 0), 0);
        
        // Calculate profit with cost of goods sold
        let totalCost = 0;
        let totalProfit = 0;
        for (const closing of filtered) {
            if (closing.salesByProduct) {
                for (const [productName, kgSold] of Object.entries(closing.salesByProduct)) {
                    const product = inventory.find(p => p.name === productName);
                    if (product) {
                        const revenue = kgSold * (product.priceKg || 0);
                        const cost = kgSold * (product.costKg || 0);
                        totalProfit += (revenue - cost);
                        totalCost += cost;
                    }
                }
            }
        }
        totalProfit = Math.round(totalProfit * 100) / 100;
        totalCost = Math.round(totalCost * 100) / 100;
        
        const filteredExpenses = expenses.filter(e => {
            const expenseDate = new Date(e.date);
            const start = reportStartDate ? new Date(reportStartDate) : null;
            const end = reportEndDate ? new Date(reportEndDate) : null;
            if (start && expenseDate < start) return false;
            if (end && expenseDate > end) return false;
            return true;
        });
        const totalExpenses = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
        
        // Net profit = Revenue - Cost - Expenses
        const netProfit = totalProfit - totalExpenses;
        const profitMargin = totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : 0;
        const netProfitMargin = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100).toFixed(1) : 0;
        
        const chartLabels = filtered.map(r => r.date).reverse();
        const chartRevenue = filtered.map(r => r.totalRevenue).reverse();
        
        if (revenueChart) revenueChart.destroy();
        if (profitChart) profitChart.destroy();
        
        setTimeout(() => {
            const revenueCtx = document.getElementById('revenueChart')?.getContext('2d');
            const profitCtx = document.getElementById('profitChart')?.getContext('2d');
            
            if (revenueCtx && chartLabels.length > 0) {
                revenueChart = new Chart(revenueCtx, {
                    type: 'line',
                    data: {
                        labels: chartLabels,
                        datasets: [{ label: 'Revenue (KES)', data: chartRevenue, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.4 }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'top' } } }
                });
            }
            
            if (profitCtx && filtered.length > 0) {
                const dailyProfits = filtered.map(r => {
                    let dayProfit = 0;
                    if (r.salesByProduct) {
                        for (const [productName, kgSold] of Object.entries(r.salesByProduct)) {
                            const product = inventory.find(p => p.name === productName);
                            if (product) {
                                const revenue = kgSold * (product.priceKg || 0);
                                const cost = kgSold * (product.costKg || 0);
                                dayProfit += (revenue - cost);
                            }
                        }
                    }
                    const dayExpenses = filteredExpenses.filter(e => e.date === r.date).reduce((sum, e) => sum + e.amount, 0);
                    return Math.round((dayProfit - dayExpenses) * 100) / 100;
                }).reverse();
                
                profitChart = new Chart(profitCtx, {
                    type: 'bar',
                    data: {
                        labels: chartLabels,
                        datasets: [{ 
                            label: 'Net Profit (KES)', 
                            data: dailyProfits, 
                            backgroundColor: dailyProfits.map(p => p >= 0 ? '#10b981' : '#ef4444'), 
                            borderRadius: 8 
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'top' } } }
                });
            }
        }, 100);
        
        const profitCardClass = netProfit >= 0 ? 'profit-card' : 'loss-card';
        
        return `<div class="report-selector">
            <div class="date-range">
                <label>📅 From:</label>
                <input type="date" id="reportStartDate" value="${reportStartDate}" onchange="updateDateRange()">
                <label>To:</label>
                <input type="date" id="reportEndDate" value="${reportEndDate}" onchange="updateDateRange()">
                <button class="btn-edit" onclick="resetDateRange()">Reset</button>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-export" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
                <button class="btn-export" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-title">Total Revenue</div><div class="stat-value">KES ${roundCurrency(totalRevenue).toLocaleString()}</div></div>
            <div class="stat-card"><div class="stat-title">Total KG Sold</div><div class="stat-value">${roundToTwo(totalKg)} kg</div></div>
            <div class="stat-card"><div class="stat-title">Cost of Goods Sold</div><div class="stat-value">KES ${roundCurrency(totalCost).toLocaleString()}</div></div>
            <div class="stat-card ${totalProfit >= 0 ? 'profit-card' : 'loss-card'}"><div class="stat-title">Gross Profit</div><div class="stat-value">KES ${roundCurrency(totalProfit).toLocaleString()}</div><div class="stat-change">Margin: ${profitMargin}%</div></div>
        </div>
        <div class="stats-grid-2">
            <div class="stat-card"><div class="stat-title">Total Expenses</div><div class="stat-value">KES ${roundCurrency(totalExpenses).toLocaleString()}</div></div>
            <div class="stat-card ${netProfit >= 0 ? 'profit-card' : 'loss-card'}"><div class="stat-title">Net Profit</div><div class="stat-value">KES ${roundCurrency(netProfit).toLocaleString()}</div><div class="stat-change">Net Margin: ${netProfitMargin}%</div></div>
        </div>
        
        <div class="card">
            <div class="card-header"><h2><i class="fas fa-chart-line"></i> Revenue Trend</h2></div>
            <div class="chart-container"><canvas id="revenueChart" height="200"></canvas></div>
        </div>
        
        <div class="card">
            <div class="card-header"><h2><i class="fas fa-chart-bar"></i> Daily Net Profit/Loss</h2></div>
            <div class="chart-container"><canvas id="profitChart" height="200"></canvas></div>
        </div>
        
        ${filtered.length === 0 ? `
        <div class="empty-state"><i class="fas fa-chart-line"></i><h3>No Reports Available</h3><p>No sales data found for the selected period.</p></div>
        ` : `
        <div class="card">
            <div class="card-header"><h2><i class="fas fa-table"></i> Detailed Sales Records</h2></div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Date</th><th>KG</th><th>Revenue</th><th>Cost</th><th>Profit</th><th>Closed By</th>${canDelete() ? '<th>Action</th>' : ''}</tr></thead>
                    <tbody>
                        ${filtered.map(r => {
                            let dayProfit = 0;
                            let dayCost = 0;
                            if (r.salesByProduct) {
                                for (const [productName, kgSold] of Object.entries(r.salesByProduct)) {
                                    const product = inventory.find(p => p.name === productName);
                                    if (product) {
                                        const revenue = kgSold * (product.priceKg || 0);
                                        const cost = kgSold * (product.costKg || 0);
                                        dayProfit += (revenue - cost);
                                        dayCost += cost;
                                    }
                                }
                            }
                            dayProfit = Math.round(dayProfit * 100) / 100;
                            dayCost = Math.round(dayCost * 100) / 100;
                            return `<tr><td style="padding:8px">${r.date}</td><td style="padding:8px">${roundToTwo(r.totalKg)}</td><td style="padding:8px">KES ${roundCurrency(r.totalRevenue).toLocaleString()}</td><td style="padding:8px">KES ${roundCurrency(dayCost).toLocaleString()}</td><td style="padding:8px"><span style="color:${dayProfit >= 0 ? '#10b981' : '#ef4444'};">KES ${roundCurrency(dayProfit).toLocaleString()}</span></td><td style="padding:8px">${r.closedBy}</td>${canDelete() ? `<td style="padding:8px"><button class="btn-delete" onclick="deleteClosingRecord(${r.id})">Delete</button></td>` : ''}</tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="card">
            <div class="card-header"><h2><i class="fas fa-receipt"></i> Expenses within Period</h2></div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th></tr></thead>
                    <tbody>
                        ${filteredExpenses.length === 0 ? '<tr><td colspan="4" style="text-align:center; padding:40px;">No expenses recorded in this period</td>' : filteredExpenses.map(e => `<tr><td style="padding:8px">${e.date}</td><td style="padding:8px">${e.category}</td><td style="padding:8px">KES ${roundCurrency(e.amount).toLocaleString()}</td><td style="padding:8px">${e.description || '-'}</td></tr>`).join('')}
                    </tbody>
                </table>
            </div>
        </div>
        `}`;
    }
    
    async function renderApp() {
        const app = document.getElementById('app');
        
        if (!token || !currentUser) {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                token = savedToken;
                const me = await apiCall('/api/me');
                if (me) {
                    currentUser = me;
                    await loadAllData();
                    renderApp();
                    return;
                } else {
                    token = null;
                    localStorage.removeItem('token');
                }
            }
            
            app.innerHTML = `<div class="login-container"><i class="fas fa-drumstick-bite" style="font-size:48px; color:#3b82f6;"></i><h2 style="margin:20px 0;">Bismillah Butchery Pro</h2><div class="form-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Enter your username"></div><div class="form-group"><div class="password-wrapper"><label>Password</label><input type="password" id="loginPasswordInput" placeholder="Enter your password"><button class="password-toggle" onclick="toggleLoginPassword()" type="button"><i class="fas fa-eye"></i></button></div></div><button class="btn" style="width:100%;" onclick="login(document.getElementById('loginUsername').value, document.getElementById('loginPasswordInput').value)">Login</button><button class="create-account-btn" onclick="showCreateAccountForm()" style="margin-top:15px; background:none; border:none; color:#3b82f6; cursor:pointer;">+ Create New Account</button>${showCreateAccount ? `<div class="modal"><div class="modal-content"><h3>Create Admin Account</h3><input type="text" id="createFullName" placeholder="Full Name *" style="margin:10px 0; width:100%;"><input type="text" id="createUsername" placeholder="Username *" style="margin:10px 0; width:100%;"><input type="password" id="createPassword" placeholder="Password *" style="margin:10px 0; width:100%;"><input type="password" id="createConfirmPassword" placeholder="Confirm Password *" style="margin:10px 0; width:100%;"><input type="email" id="createEmail" placeholder="Email (Optional)" style="margin:10px 0; width:100%;"><input type="tel" id="createPhone" placeholder="Phone (Optional)" style="margin:10px 0; width:100%;"><button class="btn btn-success" onclick="submitCreateAccount()" style="width:100%;">Register</button><button class="btn-delete" onclick="hideCreateAccountForm()" style="margin-top:10px; width:100%;">Cancel</button></div></div>` : ''}</div>`;
            return;
        }
        
        const navItems = [
            { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard' },
            { id: 'sales', icon: 'fa-cash-register', label: 'Today\'s Sales' },
            { id: 'inventory', icon: 'fa-boxes', label: 'Inventory' },
            { id: 'expenses', icon: 'fa-receipt', label: 'Expenses' },
            { id: 'reports', icon: 'fa-chart-bar', label: 'Reports' }
        ];
        if (canManageUsers()) navItems.push({ id: 'users', icon: 'fa-users', label: 'Users' });
        if (canViewLogs()) navItems.push({ id: 'logs', icon: 'fa-history', label: 'Activity Logs' });
        
        app.innerHTML = `<div class="app-container"><div class="dashboard-layout"><div class="sidebar"><div class="logo-area"><h1><i class="fas fa-drumstick-bite"></i> Bismillah</h1><p>Premium Fresh Meat</p></div>${navItems.map(item => `<div class="nav-item ${currentPage === item.id ? 'active' : ''}" onclick="setPage('${item.id}')"><i class="fas ${item.icon}"></i> ${item.label}</div>`).join('')}${isSuperAdmin() ? `<div style="margin-top:20px; padding-top:20px; border-top:1px solid #e2e8f0;"><div class="nav-item" onclick="resetAllData()" style="color:#ef4444;"><i class="fas fa-trash-alt"></i> Reset Sales Data</div></div>` : ''}</div><div class="main-content"><div class="top-bar"><div><h3>${currentUser.fullName} ${isSuperAdmin() ? '<i class="fas fa-crown" style="color:#f59e0b;"></i>' : ''}</h3><span class="role-badge">${isSuperAdmin() ? '🌟 Super Admin' : '👤 Admin'}</span></div><div><button class="btn-edit" onclick="openEditSelfModal()" style="margin-right:10px;"><i class="fas fa-user-edit"></i> Edit Profile</button><button class="btn-delete" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="card"><div class="card-header"><h2>${navItems.find(i=>i.id===currentPage)?.label || 'Dashboard'}</h2>${currentPage === 'inventory' && isSuperAdmin() ? `<button class="btn" onclick="openAddProductModal()"><i class="fas fa-plus"></i> Add Product</button>` : ''}${currentPage === 'users' && isSuperAdmin() ? `<button class="btn btn-success" onclick="showAddUserModal()" style="margin-left:10px;"><i class="fas fa-user-plus"></i> Add User</button>` : ''}</div><div>${currentPage === 'dashboard' ? renderDashboard() : currentPage === 'sales' ? renderSales() : currentPage === 'inventory' ? renderInventory() : currentPage === 'expenses' ? renderExpenses() : currentPage === 'reports' ? renderReports() : currentPage === 'users' ? renderUsers() : renderLogs()}</div></div></div></div></div>`;
    }
    
    // Initialize
    (async () => {
        const savedToken = localStorage.getItem('token');
        if (savedToken) {
            token = savedToken;
            const me = await apiCall('/api/me');
            if (me) {
                currentUser = me;
                await loadAllData();
            } else {
                token = null;
                localStorage.removeItem('token');
            }
        }
        renderApp();
    })();
</script>
</body>
</html>
