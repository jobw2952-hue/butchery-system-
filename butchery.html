<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Bismillah Butchery Pro | POS System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; }
        .app-container { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
        .dashboard-layout { display: flex; gap: 24px; min-height: 85vh; }
        .sidebar { width: 280px; background: #fff; border-radius: 20px; padding: 24px 16px; border: 1px solid #e2e8f0; position: sticky; top: 20px; }
        .logo-area { text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .logo-area h1 { font-size: 1.4rem; color: #1e293b; }
        .logo-area h1 i { color: #3b82f6; margin-right: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 0; border-radius: 12px; cursor: pointer; color: #475569; transition: all 0.2s; }
        .nav-item:hover { background: #f1f5f9; color: #3b82f6; transform: translateX(4px); }
        .nav-item.active { background: #eff6ff; color: #3b82f6; border-left: 3px solid #3b82f6; }
        .main-content { flex: 1; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 24px; background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .user-info { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
        .role-badge { background: #f1f5f9; color: #475569; padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: #fff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; position: relative; overflow: hidden; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-title { font-size: 0.7rem; text-transform: uppercase; color: #64748b; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: #1e293b; }
        .stat-icon { font-size: 2rem; opacity: 0.15; position: absolute; bottom: 12px; right: 12px; }
        .card { background: #fff; border-radius: 20px; padding: 24px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; }
        .btn { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; padding: 10px 20px; border-radius: 12px; color: white; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-delete { background: linear-gradient(135deg, #64748b, #475569); padding: 6px 14px; font-size: 0.7rem; border-radius: 8px; }
        .btn-edit { background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 6px 14px; font-size: 0.7rem; border-radius: 8px; }
        .btn-add-user { background: linear-gradient(135deg, #3b82f6, #2563eb); padding: 10px 22px; }
        .badge-blue { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .status-open { background: #10b981; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        .status-closed { background: #ef4444; color: white; padding: 4px 12px; border-radius: 20px; font-size: 0.7rem; }
        input, select { width: 100%; padding: 10px 14px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; }
        input:focus { outline: none; border-color: #3b82f6; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 6px; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { background: #f8fafc; padding: 14px 12px; text-align: left; font-weight: 600; border-bottom: 1px solid #e2e8f0; }
        .data-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .data-table tr:hover { background: #f8fafc; }
        .progress-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .stock-item { background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; }
        .stock-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; height: 100%; transition: width 0.3s; }
        .progress-fill.low { background: linear-gradient(90deg, #ef4444, #f97316); }
        .login-container { max-width: 450px; width: 90%; margin: 80px auto; padding: 40px 32px; background: #fff; border-radius: 24px; border: 1px solid #e2e8f0; text-align: center; }
        .login-logo { text-align: center; margin-bottom: 28px; }
        .login-logo i { font-size: 3rem; color: #3b82f6; }
        .login-logo h1 { font-size: 1.5rem; margin-top: 12px; }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 45px; }
        .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(4px); }
        .modal-content { background: #fff; border-radius: 24px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #e2e8f0; }
        .close-modal { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #94a3b8; }
        .close-modal:hover { color: #ef4444; }
        .summary-card { background: #f8fafc; border-radius: 16px; padding: 20px; }
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .summary-row.total { border-bottom: none; margin-top: 10px; padding-top: 15px; font-weight: 700; color: #3b82f6; }
        .role-badge-super { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .role-badge-admin { background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .password-cell { display: flex; align-items: center; gap: 8px; }
        .eye-btn, .copy-btn { background: #f1f5f9; border: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
        .activity-logs-container { max-height: 350px; overflow-y: auto; background: #f8fafc; border-radius: 12px; padding: 8px; margin-top: 16px; }
        .log-entry { padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 0.8rem; display: flex; align-items: center; gap: 10px; }
        .log-entry:hover { background: #fff; border-radius: 8px; }
        .log-dot { font-size: 0.5rem; color: #3b82f6; }
        .log-time { color: #64748b; font-size: 0.7rem; }
        .log-user { color: #3b82f6; font-weight: 600; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; background: #10b981; color: white; }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .progress-section { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { .dashboard-layout { flex-direction: column; } .sidebar { width: 100%; position: relative; } .stats-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="app"></div>

<script>
    // ========== INITIALIZE WITH DEFAULT USERS ==========
    let users = [
        { id: 1, username: "superadmin", password: "admin123", role: "super_admin", fullName: "Super Administrator", email: "super@bismillah.com", phone: "0712345678", isActive: true, createdAt: new Date().toISOString(), lastLogin: null, permissions: ['all'] },
        { id: 2, username: "admin1", password: "admin123", role: "admin", fullName: "Admin User", email: "admin@bismillah.com", phone: "0723456789", isActive: true, createdAt: new Date().toISOString(), lastLogin: null, permissions: ['sales', 'inventory_view', 'reports_view'] }
    ];
    
    let currentUser = null;
    let currentPage = 'dashboard';
    let visiblePasswords = {};
    let loginPasswordVisible = false;
    let dailyClosings = [];
    let currentDaySales = { date: new Date().toISOString().split('T')[0], totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
    let inventory = [
        { id: 1, name: "Beef Sirloin", animal: "Cow", stockKg: 150, priceKg: 800, costKg: 500, lowStockAlert: 20 },
        { id: 2, name: "Goat Meat", animal: "Goat", stockKg: 80, priceKg: 900, costKg: 600, lowStockAlert: 15 },
        { id: 3, name: "Whole Chicken", animal: "Chicken", stockKg: 120, priceKg: 550, costKg: 350, lowStockAlert: 25 },
        { id: 4, name: "Beef Liver", animal: "Liver", stockKg: 60, priceKg: 400, costKg: 250, lowStockAlert: 10 },
        { id: 5, name: "Beef Mince", animal: "Cow", stockKg: 100, priceKg: 750, costKg: 480, lowStockAlert: 15 }
    ];
    let expenses = [];
    let activityLogs = [];
    let nextId = { inventory: 6, expenses: 1, users: 3, closings: 1 };
    let isSyncing = false;
    
    const API_BASE = window.location.origin;
    
    // Save session to localStorage to persist on refresh
    function saveSession() {
        if (currentUser) {
            localStorage.setItem('loggedInUser', JSON.stringify({
                id: currentUser.id,
                username: currentUser.username,
                role: currentUser.role,
                fullName: currentUser.fullName,
                permissions: currentUser.permissions
            }));
        } else {
            localStorage.removeItem('loggedInUser');
        }
    }
    
    // Load session from localStorage
    function loadSession() {
        const savedUser = localStorage.getItem('loggedInUser');
        if (savedUser) {
            const userData = JSON.parse(savedUser);
            const fullUser = users.find(u => u.id === userData.id);
            if (fullUser && fullUser.isActive) {
                currentUser = fullUser;
                return true;
            }
        }
        return false;
    }
    
    // Sync function
    async function syncToServer() {
        if (isSyncing || !currentUser) return;
        isSyncing = true;
        try {
            const data = { users, inventory, dailyClosings, currentDaySales, expenses, activityLogs, nextId };
            await fetch(`${API_BASE}/api/save`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
        } catch(e) { console.error(e); }
        finally { isSyncing = false; }
    }
    
    async function loadFromServer() {
        try {
            const response = await fetch(`${API_BASE}/api/data`);
            const data = await response.json();
            if (data && data.users && data.users.length > 0) {
                users = data.users;
                inventory = data.inventory || inventory;
                dailyClosings = data.dailyClosings || [];
                currentDaySales = data.currentDaySales || { date: new Date().toISOString().split('T')[0], totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
                expenses = data.expenses || [];
                activityLogs = data.activityLogs || [];
                nextId = data.nextId || { inventory: 6, expenses: 1, users: 3, closings: 1 };
                const today = new Date().toISOString().split('T')[0];
                if (currentDaySales.date !== today && !currentDaySales.isClosed) {
                    currentDaySales = { date: today, totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
                }
                return true;
            }
        } catch(e) { console.error(e); }
        return false;
    }
    
    function addLog(action, details) {
        activityLogs.unshift({ id: Date.now(), timestamp: new Date().toLocaleString(), user: currentUser?.username || 'system', action, details });
        if (activityLogs.length > 200) activityLogs.pop();
        syncToServer();
    }
    
    function login(username, password) {
        const user = users.find(u => u.username === username && u.password === password && u.isActive);
        if (user) {
            currentUser = user;
            user.lastLogin = new Date().toLocaleString();
            addLog('Login', `${user.fullName} (${user.role}) logged in`);
            saveSession();
            renderApp();
            return true;
        }
        alert('Invalid credentials!');
        return false;
    }
    
    function logout() {
        addLog('Logout', `${currentUser?.fullName} logged out`);
        currentUser = null;
        localStorage.removeItem('loggedInUser');
        renderApp();
    }
    
    function hasPermission(perm) {
        if (!currentUser) return false;
        if (currentUser.role === 'super_admin') return true;
        return currentUser.permissions?.includes(perm) || false;
    }
    
    window.togglePasswordVisibility = (id) => { visiblePasswords[id] = !visiblePasswords[id]; renderApp(); };
    window.toggleLoginPassword = () => {
        loginPasswordVisible = !loginPasswordVisible;
        const inp = document.getElementById('loginPassword');
        if (inp) inp.type = loginPasswordVisible ? 'text' : 'password';
        const eye = document.getElementById('loginEyeIcon');
        if (eye) eye.className = loginPasswordVisible ? 'fas fa-eye-slash' : 'fas fa-eye';
    };
    window.copyPassword = (u, p) => { navigator.clipboard.writeText(p); alert(`Password for "${u}" copied!`); };
    
    window.updateDailySales = () => {
        if (currentDaySales.isClosed) return alert('Today is closed!');
        const kg = parseFloat(document.getElementById('dailyKg')?.value);
        const cash = parseFloat(document.getElementById('dailyCash')?.value);
        const mpesa = parseFloat(document.getElementById('dailyMpesa')?.value);
        if (isNaN(kg) || kg <= 0) return alert('Enter valid KG');
        if (isNaN(cash) || cash < 0) return alert('Enter valid Cash');
        if (isNaN(mpesa) || mpesa < 0) return alert('Enter valid M-Pesa');
        currentDaySales.totalKg += kg;
        currentDaySales.cashAmount += cash;
        currentDaySales.mpesaAmount += mpesa;
        addLog('Sales Update', `${currentUser?.username} added ${kg}kg | Cash: ${cash} | M-Pesa: ${mpesa}`);
        renderApp();
        alert('Sales updated successfully!');
    };
    
    window.closeDay = () => {
        if (currentDaySales.isClosed) return alert('Already closed');
        if (currentDaySales.totalKg === 0 && currentDaySales.cashAmount === 0 && currentDaySales.mpesaAmount === 0) return alert('No sales recorded');
        const total = currentDaySales.cashAmount + currentDaySales.mpesaAmount;
        if (confirm(`Close day ${currentDaySales.date}?\nKG: ${currentDaySales.totalKg} kg\nCash: KES ${currentDaySales.cashAmount.toLocaleString()}\nM-Pesa: KES ${currentDaySales.mpesaAmount.toLocaleString()}\nTotal: KES ${total.toLocaleString()}`)) {
            dailyClosings.unshift({ id: nextId.closings++, date: currentDaySales.date, totalKg: currentDaySales.totalKg, cashAmount: currentDaySales.cashAmount, mpesaAmount: currentDaySales.mpesaAmount, totalRevenue: total, closedBy: currentUser?.fullName });
            currentDaySales.isClosed = true;
            addLog('Day Closing', `${currentUser?.username} closed day with total KES ${total.toLocaleString()}`);
            renderApp();
            alert('Day closed successfully!');
        }
    };
    
    window.startNewDay = () => {
        const today = new Date().toISOString().split('T')[0];
        if (!currentDaySales.isClosed && (currentDaySales.totalKg > 0 || currentDaySales.cashAmount > 0)) return alert('Close current day first');
        currentDaySales = { date: today, totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false };
        addLog('New Day', `${currentUser?.username} started new day`);
        renderApp();
        alert('New day started!');
    };
    
    window.deleteClosingRecord = (id) => {
        if (currentUser?.role !== 'super_admin') return alert('Only Super Admin can delete');
        if (confirm('Delete this record?')) {
            dailyClosings = dailyClosings.filter(r => r.id !== id);
            addLog('Delete Record', `${currentUser?.username} deleted closing record`);
            renderApp();
        }
    };
    
    window.deleteInventoryProduct = (id) => {
        if (currentUser?.role !== 'super_admin') return alert('Only Super Admin can delete products');
        const product = inventory.find(p => p.id === id);
        if (!product) return;
        if (confirm(`Delete "${product.name}"?`)) {
            inventory = inventory.filter(p => p.id !== id);
            addLog('Delete Product', `${currentUser?.username} deleted ${product.name}`);
            renderApp();
        }
    };
    
    window.openFullEditModal = (id) => {
        if (currentUser?.role !== 'super_admin') return alert('Only Super Admin can edit products');
        const product = inventory.find(p => p.id === id);
        if (!product) return;
        const modalHtml = `<div class="modal" id="editModal"><div class="modal-content"><div class="modal-header"><h3>Edit Product</h3><button class="close-modal" onclick="closeEditModal()">&times;</button></div>
            <div class="form-group"><label>Name</label><input id="editName" value="${product.name}"></div>
            <div class="form-group"><label>Animal</label><select id="editAnimal"><option value="Cow" ${product.animal==='Cow'?'selected':''}>Cow</option><option value="Goat" ${product.animal==='Goat'?'selected':''}>Goat</option><option value="Chicken" ${product.animal==='Chicken'?'selected':''}>Chicken</option><option value="Liver" ${product.animal==='Liver'?'selected':''}>Liver</option></select></div>
            <div class="form-group"><label>Stock (kg)</label><input type="number" id="editStock" value="${product.stockKg}"></div>
            <div class="form-group"><label>Price (KES/kg)</label><input type="number" id="editPrice" value="${product.priceKg}"></div>
            <div class="form-group"><label>Cost (KES/kg)</label><input type="number" id="editCost" value="${product.costKg}"></div>
            <div class="form-group"><label>Low Stock Alert (kg)</label><input type="number" id="editAlert" value="${product.lowStockAlert}"></div>
            <button class="btn btn-success" onclick="saveFullEdit(${id})">Save Changes</button>
        </div></div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.closeEditModal = () => { const m = document.getElementById('editModal'); if(m) m.remove(); };
    window.saveFullEdit = (id) => {
        const product = inventory.find(p => p.id === id);
        if(product) {
            product.name = document.getElementById('editName')?.value;
            product.animal = document.getElementById('editAnimal')?.value;
            product.stockKg = parseFloat(document.getElementById('editStock')?.value);
            product.priceKg = parseFloat(document.getElementById('editPrice')?.value);
            product.costKg = parseFloat(document.getElementById('editCost')?.value);
            product.lowStockAlert = parseFloat(document.getElementById('editAlert')?.value);
            addLog('Inventory Edit', `${currentUser?.username} edited ${product.name}`);
            closeEditModal();
            renderApp();
        }
    };
    
    window.openAddStockModal = () => {
        if (currentUser?.role !== 'super_admin') return alert('Only Super Admin can add products');
        const name = prompt('Product name:');
        const animal = prompt('Animal (Cow/Goat/Chicken/Liver):');
        const stock = parseFloat(prompt('Stock (kg):'));
        const price = parseFloat(prompt('Price per kg (KES):'));
        const cost = parseFloat(prompt('Cost per kg (KES):'));
        if(name && animal && stock && price) {
            inventory.push({ id: nextId.inventory++, name, animal, stockKg: stock, priceKg: price, costKg: cost || price*0.7, lowStockAlert: 10 });
            addLog('Add Product', `${currentUser?.username} added ${name}`);
            renderApp();
            alert(`Product "${name}" added successfully!`);
        }
    };
    
    window.addExpense = () => {
        const cat = document.getElementById('expCategory')?.value;
        const amt = parseFloat(document.getElementById('expAmount')?.value);
        const desc = document.getElementById('expDesc')?.value;
        if(!cat || isNaN(amt) || amt<=0) return alert('Enter valid expense');
        expenses.push({ id: nextId.expenses++, date: new Date().toISOString().split('T')[0], category: cat, amount: amt, description: desc });
        addLog('Add Expense', `${currentUser?.username} added ${cat} - KES ${amt}`);
        renderApp();
        alert('Expense added!');
    };
    
    window.deleteExpense = (id) => {
        if (currentUser?.role !== 'super_admin') return alert('Only Super Admin can delete expenses');
        const exp = expenses.find(e => e.id === id);
        if(exp && confirm(`Delete "${exp.category}" expense?`)) {
            expenses = expenses.filter(e => e.id !== id);
            addLog('Delete Expense', `${currentUser?.username} deleted ${exp.category}`);
            renderApp();
        }
    };
    
    window.openAddUserModal = () => {
        if(!hasPermission('manage_users')) return alert('Only Super Admin can add users');
        const modalHtml = `<div class="modal" id="userModal"><div class="modal-content"><div class="modal-header"><h3>Add New User</h3><button class="close-modal" onclick="closeUserModal()">&times;</button></div>
            <div class="form-group"><label>Full Name</label><input id="newFullName" placeholder="John Doe"></div>
            <div class="form-group"><label>Username</label><input id="newUsername" placeholder="username"></div>
            <div class="form-group"><label>Password</label><input type="password" id="newPassword" placeholder="min 4 characters"></div>
            <div class="form-group"><label>Confirm Password</label><input type="password" id="newConfirm"></div>
            <div class="form-group"><label>Email</label><input id="newEmail" placeholder="email@example.com"></div>
            <div class="form-group"><label>Phone</label><input id="newPhone" placeholder="0712345678"></div>
            <div class="form-group"><label>Role</label><select id="newRole"><option value="admin">Admin</option><option value="super_admin">Super Admin</option></select></div>
            <button class="btn btn-success" onclick="addNewUser()">Create User</button>
        </div></div>`;
        document.body.insertAdjacentHTML('beforeend', modalHtml);
    };
    
    window.addNewUser = () => {
        const name = document.getElementById('newFullName')?.value;
        const uname = document.getElementById('newUsername')?.value;
        const pass = document.getElementById('newPassword')?.value;
        const confirm = document.getElementById('newConfirm')?.value;
        if(!name || !uname || !pass) return alert('Fill all required fields');
        if(pass !== confirm) return alert('Passwords do not match');
        if(pass.length < 4) return alert('Password must be at least 4 characters');
        if(users.find(u => u.username === uname)) return alert('Username already exists!');
        const role = document.getElementById('newRole')?.value;
        users.push({ id: nextId.users++, username: uname, password: pass, role, fullName: name, email: document.getElementById('newEmail')?.value || '', phone: document.getElementById('newPhone')?.value || '', isActive: true, createdAt: new Date().toISOString(), lastLogin: null, permissions: role === 'super_admin' ? ['all'] : ['sales', 'inventory_view', 'reports_view'] });
        addLog('User Created', `${currentUser?.username} created user ${uname}`);
        closeUserModal();
        renderApp();
        alert(`User "${uname}" created successfully!\nPassword: ${pass}`);
    };
    
    window.closeUserModal = () => { const m = document.getElementById('userModal'); if(m) m.remove(); };
    window.resetUserPassword = (id) => {
        if(!hasPermission('manage_users')) return alert('Only Super Admin can reset passwords');
        const newPass = prompt('Enter new password (min 4 characters):');
        if(newPass && newPass.length >= 4) {
            const confirmPass = prompt('Confirm new password:');
            if(newPass === confirmPass) {
                const user = users.find(u => u.id === id);
                if(user) { user.password = newPass; addLog('Password Reset', `${currentUser?.username} reset ${user.username}'s password`); renderApp(); alert(`Password for "${user.username}" reset to: ${newPass}`); }
            } else alert('Passwords do not match');
        }
    };
    
    window.toggleUserStatus = (id) => {
        if(!hasPermission('manage_users')) return alert('Only Super Admin can change user status');
        const user = users.find(u => u.id === id);
        if(user && user.id !== currentUser?.id) {
            user.isActive = !user.isActive;
            addLog('User Status', `${user.isActive ? 'Activated' : 'Deactivated'} ${user.username}`);
            renderApp();
        }
    };
    
    function getTodayStats() {
        return { totalKg: currentDaySales.totalKg, totalCash: currentDaySales.cashAmount, totalMpesa: currentDaySales.mpesaAmount, totalRevenue: currentDaySales.cashAmount + currentDaySales.mpesaAmount, isClosed: currentDaySales.isClosed };
    }
    
    function getTotalStats() {
        const totalKg = dailyClosings.reduce((s,c)=>s+c.totalKg,0) + currentDaySales.totalKg;
        const totalCash = dailyClosings.reduce((s,c)=>s+c.cashAmount,0) + currentDaySales.cashAmount;
        const totalMpesa = dailyClosings.reduce((s,c)=>s+c.mpesaAmount,0) + currentDaySales.mpesaAmount;
        const totalExpenses = expenses.reduce((s,e)=>s+e.amount,0);
        return { totalKg, totalCash, totalMpesa, totalRevenue: totalCash+totalMpesa, totalExpenses };
    }
    
    function renderDashboard() {
        const stats = getTodayStats();
        const totalStats = getTotalStats();
        const netProfit = totalStats.totalRevenue - totalStats.totalExpenses;
        const stockItems = inventory.map(i => {
            const max = i.lowStockAlert * 3;
            const percent = Math.min((i.stockKg/max)*100,100);
            let cls = '';
            if(percent<30) cls='low';
            else if(percent<60) cls='medium';
            return `<div class="stock-item"><div class="stock-info"><span class="stock-name">🥩 ${i.name}</span><span class="stock-quantity">${i.stockKg.toFixed(1)}/${max} kg</span></div><div class="progress-bar"><div class="progress-fill ${cls}" style="width:${percent}%"></div></div></div>`;
        }).join('');
        return `<div class="stats-grid"><div class="stat-card"><div class="stat-title">Today's KG</div><div class="stat-value">${stats.totalKg.toFixed(1)} kg</div><i class="fas fa-weight-hanging stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Today's Cash</div><div class="stat-value">KES ${stats.totalCash.toLocaleString()}</div><i class="fas fa-money-bill-wave stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Today's M-Pesa</div><div class="stat-value">KES ${stats.totalMpesa.toLocaleString()}</div><i class="fas fa-mobile-alt stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Today's Revenue</div><div class="stat-value">KES ${stats.totalRevenue.toLocaleString()}</div><i class="fas fa-chart-line stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Net Profit</div><div class="stat-value" style="color:#10b981;">KES ${netProfit.toLocaleString()}</div><i class="fas fa-chart-pie stat-icon"></i></div></div>
            <div class="card"><div class="card-header"><h2>Stock Overview</h2></div><div class="progress-section">${stockItems}</div></div>`;
    }
    
    function renderSalesEntry() {
        const stats = getTodayStats();
        const isClosed = stats.isClosed;
        const isSuper = currentUser?.role === 'super_admin';
        return `<div class="card"><div class="card-header"><h2>Daily Sales Entry</h2>${!isClosed ? '<span class="status-open">OPEN</span>' : '<span class="status-closed">CLOSED</span>'}</div>
            ${isClosed ? `<div class="summary-card"><p>Today's sales are finalized.</p><button class="btn" onclick="startNewDay()">Start New Day</button></div>` : 
            `<div class="form-group"><label>KG Sold</label><input type="number" id="dailyKg" step="0.1" placeholder="Enter kg sold"></div>
            <div class="form-group"><label>Cash Received (KES)</label><input type="number" id="dailyCash" step="100" placeholder="0"></div>
            <div class="form-group"><label>M-Pesa Received (KES)</label><input type="number" id="dailyMpesa" step="100" placeholder="0"></div>
            <button class="btn" onclick="updateDailySales()"><i class="fas fa-plus-circle"></i> Add Sales</button>`}</div>
            <div class="card"><div class="card-header"><h2>Today's Summary</h2>${!isClosed ? `<button class="btn btn-success" onclick="closeDay()"><i class="fas fa-lock"></i> Close Day</button>` : ''}</div>
            <div class="summary-card"><div class="summary-row"><strong>Date:</strong> <span>${currentDaySales.date}</span></div>
            <div class="summary-row"><strong>KG Sold:</strong> <span>${stats.totalKg.toFixed(1)} kg</span></div>
            <div class="summary-row"><strong>Cash:</strong> <span>KES ${stats.totalCash.toLocaleString()}</span></div>
            <div class="summary-row"><strong>M-Pesa:</strong> <span>KES ${stats.totalMpesa.toLocaleString()}</span></div>
            <div class="summary-row total"><strong>TOTAL REVENUE:</strong> <span>KES ${stats.totalRevenue.toLocaleString()}</span></div></div></div>
            <div class="card"><div class="card-header"><h2>Previous Days Records</h2>${isSuper ? '<span class="badge-blue"><i class="fas fa-trash"></i> Delete records</span>' : ''}</div>
            <div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total</th><th>Closed By</th>${isSuper ? '<th></th>' : ''}</tr></thead>
            <tbody>${dailyClosings.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No records yet</td>' : dailyClosings.map(c => `<tr><td style="padding:12px;">${c.date}</td><td style="padding:12px;">${c.totalKg.toFixed(1)} kg</td><td style="padding:12px;">KES ${c.cashAmount.toLocaleString()}</td><td style="padding:12px;">KES ${c.mpesaAmount.toLocaleString()}</td><td style="padding:12px; color:#3b82f6; font-weight:bold;">KES ${c.totalRevenue.toLocaleString()}</td><td style="padding:12px;">${c.closedBy}</td>${isSuper ? `<td style="padding:12px;"><button class="btn-delete" onclick="deleteClosingRecord(${c.id})">Delete</button></td>` : ''} `).join('')}</tbody>}</table</div></div>`;
    }
    
    // INVENTORY - Admin has NO edit/delete buttons (View only)
    function renderInventory() {
        const isSuper = currentUser?.role === 'super_admin';
        return `<div class="card"><div class="card-header"><h2><i class="fas fa-boxes"></i> Inventory Management</h2>${isSuper ? '<button class="btn" onclick="openAddStockModal()"><i class="fas fa-plus"></i> Add Product</button>' : '<span class="role-badge-admin"><i class="fas fa-eye"></i> View Only - No Edit/Delete Access</span>'}</div>
            <div class="table-container"><table class="data-table"><thead><tr><th>Product</th><th>Animal</th><th>Stock (kg)</th><th>Price/kg (KES)</th><th>Cost/kg (KES)</th><th>Profit/kg</th><th>Alert Level</th><th>Actions</th></tr></thead>
            <tbody>${inventory.map(p => `<tr><td style="padding:12px;"><strong>${p.name}</strong></td><td style="padding:12px;">${p.animal}</td><td style="padding:12px; color:${p.stockKg<=p.lowStockAlert?'#ef4444':'#10b981'}; font-weight:bold;">${p.stockKg.toFixed(1)} kg</td><td style="padding:12px;">KES ${p.priceKg.toLocaleString()}</td><td style="padding:12px;">KES ${p.costKg.toLocaleString()}</td><td style="padding:12px; color:#10b981;">KES ${(p.priceKg-p.costKg).toLocaleString()}</td><td style="padding:12px;">${p.lowStockAlert} kg</td>
            <td class="action-buttons">${isSuper ? `<button class="btn-edit" onclick="openFullEditModal(${p.id})"><i class="fas fa-edit"></i> Edit</button><button class="btn-delete" onclick="deleteInventoryProduct(${p.id})"><i class="fas fa-trash"></i> Delete</button>` : '<span class="role-badge-admin"><i class="fas fa-lock"></i> Read Only</span>'}</td>`).join('')}</tbody>}</table</div></div>`;
    }
    
    function renderExpenses() {
        const totalExp = expenses.reduce((s,e)=>s+e.amount,0);
        const totalRev = getTotalStats().totalRevenue;
        const net = totalRev - totalExp;
        const isSuper = currentUser?.role === 'super_admin';
        return `<div class="stats-grid"><div class="stat-card"><div class="stat-title">Total Expenses</div><div class="stat-value">KES ${totalExp.toLocaleString()}</div><i class="fas fa-coins stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Total Revenue</div><div class="stat-value">KES ${totalRev.toLocaleString()}</div><i class="fas fa-chart-line stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Net Profit</div><div class="stat-value" style="color:#10b981;">KES ${net.toLocaleString()}</div><i class="fas fa-chart-pie stat-icon"></i></div></div>
            <div class="card"><div class="card-header"><h2><i class="fas fa-plus-circle"></i> Add Expense</h2></div><div class="form-group"><label>Category</label><input id="expCategory" placeholder="e.g., Rent, Salaries, Transport"></div>
            <div class="form-group"><label>Amount (KES)</label><input type="number" id="expAmount" placeholder="0"></div><div class="form-group"><label>Description</label><input id="expDesc" placeholder="Optional notes"></div>
            <button class="btn" onclick="addExpense()"><i class="fas fa-save"></i> Add Expense</button></div>
            <div class="card"><div class="card-header"><h2><i class="fas fa-history"></i> Expense History</h2>${isSuper ? '<span class="badge-blue">Delete expenses</span>' : ''}</div>
            <div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Amount (KES)</th><th>Description</th>${isSuper ? '<th></th>' : ''}</tr></thead>
            <tbody>${expenses.length === 0 ? '<tr><td colspan="4" style="text-align:center;">No expenses recorded yet</td>' : expenses.map(e => `<td><td style="padding:12px;">${e.date}</td><td style="padding:12px;"><strong>${e.category}</strong></td><td style="padding:12px;">KES ${e.amount.toLocaleString()}</td><td style="padding:12px;">${e.description||'-'}</td>${isSuper ? `<td style="padding:12px;"><button class="btn-delete" onclick="deleteExpense(${e.id})">Delete</button></td>` : ''} `).join('')}</tbody>}</table</div></div>`;
    }
    
    function renderReports() {
        const totalStats = getTotalStats();
        const isSuper = currentUser?.role === 'super_admin';
        return `<div class="stats-grid"><div class="stat-card"><div class="stat-title">Total KG Sold</div><div class="stat-value">${totalStats.totalKg.toFixed(1)} kg</div><i class="fas fa-weight-hanging stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Total Cash</div><div class="stat-value">KES ${totalStats.totalCash.toLocaleString()}</div><i class="fas fa-money-bill-wave stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Total M-Pesa</div><div class="stat-value">KES ${totalStats.totalMpesa.toLocaleString()}</div><i class="fas fa-mobile-alt stat-icon"></i></div>
            <div class="stat-card"><div class="stat-title">Total Revenue</div><div class="stat-value">KES ${totalStats.totalRevenue.toLocaleString()}</div><i class="fas fa-chart-line stat-icon"></i></div></div>
            <div class="card"><div class="card-header"><h2><i class="fas fa-file-alt"></i> All Closing Records</h2>${isSuper ? '<span class="badge-blue">Delete records</span>' : ''}</div>
            <div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total Revenue</th><th>Closed By</th>${isSuper ? '<th></th>' : ''}</tr></thead>
            <tbody>${dailyClosings.length === 0 ? '<tr><td colspan="6" style="text-align:center;">No closing records yet</td>' : dailyClosings.map(c => `<tr><td style="padding:12px;">${c.date}</td><td style="padding:12px;">${c.totalKg.toFixed(1)} kg</td><td style="padding:12px;">KES ${c.cashAmount.toLocaleString()}</td><td style="padding:12px;">KES ${c.mpesaAmount.toLocaleString()}</td><td style="padding:12px; color:#3b82f6; font-weight:bold;">KES ${c.totalRevenue.toLocaleString()}</td><td style="padding:12px;">${c.closedBy}</td>${isSuper ? `<td style="padding:12px;"><button class="btn-delete" onclick="deleteClosingRecord(${c.id})">Delete</button></td>` : ''} `).join('')}</tbody>}</table</div></div>`;
    }
    
    function renderUserManagement() {
        if(!hasPermission('manage_users')) return '<div class="card"><p><i class="fas fa-lock"></i> Access Denied. Super Admin only.</p></div>';
        let html = `<div class="card"><div class="card-header"><h2><i class="fas fa-users"></i> User Management</h2><button class="btn-add-user" onclick="openAddUserModal()"><i class="fas fa-user-plus"></i> Add User</button></div>
            <div class="table-container"><table class="data-table"><thead><tr><th>Username</th><th>Full Name</th><th>Password</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>`;
        html += users.map(u => `<tr><td style="padding:12px;"><strong>${u.username}</strong></td><td style="padding:12px;">${u.fullName}</td>
            <td style="padding:12px;"><div class="password-cell"><span>${visiblePasswords[u.id]?u.password:'••••••••'}</span><button class="eye-btn" onclick="togglePasswordVisibility(${u.id})"><i class="fas ${visiblePasswords[u.id]?'fa-eye-slash':'fa-eye'}"></i></button><button class="copy-btn" onclick="copyPassword('${u.username}','${u.password}')"><i class="fas fa-copy"></i></button></div></td>
            <td style="padding:12px;">${u.email||'-'}</td><td style="padding:12px;">${u.phone||'-'}</td><td style="padding:12px;"><span class="${u.role==='super_admin'?'role-badge-super':'role-badge-admin'}">${u.role==='super_admin'?'👑 Super Admin':'👨‍💼 Admin'}</span></td>
            <td style="padding:12px; color:${u.isActive?'#10b981':'#ef4444'}; font-weight:bold;">${u.isActive?'🟢 Active':'🔴 Disabled'}</td><td style="padding:12px;">${u.lastLogin||'Never'}</td>
            <td class="action-buttons"><button class="btn-reset" onclick="resetUserPassword(${u.id})">Reset Pwd</button>${u.role!=='super_admin'?`<button class="${u.isActive?'btn-delete':'btn-success'}" onclick="toggleUserStatus(${u.id})">${u.isActive?'Disable':'Enable'}</button>`:'<span class="role-badge-super">Protected</span>'}</td>`).join('');
        html += `</tbody>}</table</div></div>
            <div class="card"><div class="card-header"><h2><i class="fas fa-history"></i> System Activity Logs</h2><span class="badge-blue">All User Actions</span></div>
            <div class="activity-logs-container">${activityLogs.slice(0,50).map(l=>`<div class="log-entry"><i class="fas fa-circle log-dot"></i><span class="log-time">[${l.timestamp}]</span><strong class="log-user">${l.user}</strong><span>: ${l.action}</span></div>`).join('')}${activityLogs.length===0?'<div>No activity logs yet</div>':''}</div></div>`;
        return html;
    }
    
    function renderLogin() {
        return `<div class="login-container">
            <div class="login-logo">
                <i class="fas fa-drumstick-bite"></i>
                <h1>Bismillah Butchery Pro</h1>
                <p>Fresh Meat Always</p>
            </div>
            <div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="loginPassword" placeholder="Enter password">
                        <button type="button" class="password-toggle" onclick="toggleLoginPassword()">
                            <i class="fas fa-eye" id="loginEyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button class="btn login-btn" style="width:100%; justify-content:center;" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </div>
        </div>`;
    }
    
    function renderApp() {
        if (!currentUser) {
            document.getElementById('app').innerHTML = renderLogin();
            return;
        }
        
        const pages = { dashboard: renderDashboard(), sales: renderSalesEntry(), inventory: renderInventory(), expenses: renderExpenses(), reports: renderReports(), users: renderUserManagement() };
        const navs = [{id:'dashboard',icon:'fa-chart-line',label:'Dashboard'},{id:'sales',icon:'fa-cart-shopping',label:'Daily Closing'},{id:'inventory',icon:'fa-boxes',label:'Inventory'},{id:'expenses',icon:'fa-coins',label:'Expenses'},{id:'reports',icon:'fa-chart-simple',label:'Reports'}];
        if(hasPermission('manage_users')) navs.push({id:'users',icon:'fa-users-cog',label:'User Mgmt'});
        const sidebar = `<div class="sidebar"><div class="logo-area"><i class="fas fa-drumstick-bite" style="font-size:2rem;"></i><h1>Bismillah</h1><p>Fresh Meat Always</p></div>${navs.map(n=>`<div class="nav-item ${currentPage===n.id?'active':''}" onclick="changePage('${n.id}')"><i class="fas ${n.icon}"></i> ${n.label}</div>`).join('')}<div class="nav-item" onclick="logout()" style="margin-top:40px;"><i class="fas fa-sign-out-alt"></i> Logout</div></div>`;
        const top = `<div class="top-bar"><div><h2><i class="fas ${currentPage==='dashboard'?'fa-chart-line':currentPage==='sales'?'fa-cart-shopping':currentPage==='inventory'?'fa-boxes':currentPage==='expenses'?'fa-coins':currentPage==='reports'?'fa-chart-simple':'fa-users'}"></i> ${currentPage.toUpperCase()}</h2></div><div class="user-info"><span><i class="fas fa-calendar"></i> ${new Date().toLocaleDateString()}</span><span class="role-badge"><i class="fas ${currentUser.role==='super_admin'?'fa-crown':'fa-user-shield'}"></i> ${currentUser.role==='super_admin'?'Super Admin':'Admin'}</span><span><i class="fas fa-user"></i> ${currentUser.fullName}</span><span class="status-badge"><i class="fas fa-check-circle"></i> Live</span></div></div>`;
        document.getElementById('app').innerHTML = `<div class="app-container"><div class="dashboard-layout">${sidebar}<div class="main-content">${top}${pages[currentPage]||pages.dashboard}</div></div></div>`;
    }
    
    window.changePage = (page) => { currentPage = page; renderApp(); };
    window.handleLogin = () => {
        const user = document.getElementById('loginUsername')?.value;
        const pass = document.getElementById('loginPassword')?.value;
        if(!user || !pass) {
            alert('Please enter username and password');
            return;
        }
        login(user, pass);
    };
    
    // Auto-sync every 5 seconds
    setInterval(() => { if(currentUser) syncToServer(); }, 5000);
    
    // Check for saved session on page load - THIS KEEPS USER LOGGED IN ON REFRESH
    window.addEventListener('DOMContentLoaded', async () => {
        await loadFromServer();
        const hasSession = loadSession();
        if (hasSession && currentUser) {
            renderApp();
        } else {
            renderApp();
        }
    });
</script>
</body>
</html>
