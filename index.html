<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bismillah Butchery Pro | Fresh Meat Always</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; color: #1e293b; min-height: 100vh; }
        .app-container { max-width: 1600px; margin: 0 auto; padding: 20px 24px; }
        .version-badge { position: fixed; bottom: 10px; right: 10px; background: #10b981; color: white; padding: 4px 10px; border-radius: 20px; font-size: 10px; z-index: 999; cursor: pointer; }
        .version-badge:hover { background: #059669; }
        .password-wrapper { position: relative; width: 100%; display: inline-block; }
        .password-wrapper input { width: 100%; padding: 12px 45px 12px 16px; border-radius: 12px; background: #ffffff; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        .password-wrapper .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 1.1rem; padding: 0; }
        .password-wrapper .password-toggle:hover { color: #3b82f6; }
        .dashboard-layout { display: flex; gap: 24px; min-height: 85vh; }
        .sidebar { width: 280px; background: #ffffff; border-radius: 20px; padding: 24px 16px; border: 1px solid #e2e8f0; position: sticky; top: 20px; height: fit-content; }
        .logo-area { text-align: center; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
        .logo-area h1 { font-size: 1.4rem; color: #1e293b; }
        .logo-area h1 i { color: #3b82f6; margin-right: 8px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; margin: 4px 0; border-radius: 12px; cursor: pointer; color: #475569; font-size: 0.9rem; transition: all 0.2s; }
        .nav-item:hover { background: #f1f5f9; color: #3b82f6; }
        .nav-item.active { background: #eff6ff; color: #3b82f6; font-weight: 500; }
        .main-content { flex: 1; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px 24px; background: #ffffff; border-radius: 16px; border: 1px solid #e2e8f0; }
        .role-badge { background: #f1f5f9; color: #475569; padding: 6px 14px; border-radius: 30px; font-size: 0.75rem; font-weight: 500; }
        .role-badge-super { background: #8b5cf6; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .role-badge-admin { background: #3b82f6; color: white; padding: 4px 12px; border-radius: 30px; font-size: 0.7rem; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        .stat-card { background: #ffffff; border-radius: 16px; padding: 20px; border: 1px solid #e2e8f0; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-2px); }
        .stat-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; }
        .stat-value { font-size: 1.8rem; font-weight: 700; margin-top: 8px; color: #1e293b; }
        .card { background: #ffffff; border-radius: 20px; padding: 24px; margin-bottom: 24px; border: 1px solid #e2e8f0; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid #e2e8f0; flex-wrap: wrap; gap: 10px; }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; }
        .btn { background: #3b82f6; border: none; padding: 10px 20px; border-radius: 10px; color: white; font-weight: 500; cursor: pointer; font-size: 0.85rem; transition: all 0.2s; }
        .btn:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-success { background: #10b981; }
        .btn-success:hover { background: #059669; }
        .btn-warning { background: #f59e0b; }
        .btn-warning:hover { background: #d97706; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .btn-delete { background: #ef4444; padding: 6px 12px; font-size: 0.7rem; border-radius: 6px; color: white; cursor: pointer; border: none; }
        .btn-delete:hover { background: #dc2626; }
        .btn-edit { background: #3b82f6; padding: 6px 12px; font-size: 0.7rem; border-radius: 6px; color: white; cursor: pointer; border: none; }
        .btn-edit:hover { background: #2563eb; }
        .btn-export { background: #10b981; padding: 8px 16px; font-size: 0.75rem; border-radius: 8px; color: white; cursor: pointer; border: none; }
        .btn-export:hover { background: #059669; }
        input, select, textarea { width: 100%; padding: 10px 14px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; font-size: 0.9rem; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; }
        .form-group { margin-bottom: 16px; }
        label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; color: #64748b; display: block; margin-bottom: 6px; }
        .table-container { overflow-x: auto; border-radius: 12px; border: 1px solid #e2e8f0; }
        .data-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .data-table th { background: #f8fafc; padding: 14px 12px; text-align: left; font-weight: 600; color: #475569; border-bottom: 1px solid #e2e8f0; }
        .data-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .data-table tr:hover { background: #f8fafc; }
        .progress-section { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .stock-item { background: #f8fafc; border-radius: 12px; padding: 16px; border: 1px solid #e2e8f0; }
        .stock-info { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .stock-name { font-weight: 600; }
        .progress-bar { background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; }
        .progress-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; height: 100%; transition: width 0.3s; }
        .progress-fill.low { background: linear-gradient(90deg, #ef4444, #f97316); }
        .login-container { max-width: 450px; margin: 60px auto; padding: 40px; background: #ffffff; border-radius: 24px; border: 1px solid #e2e8f0; text-align: center; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: #ffffff; border-radius: 20px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; }
        .close-modal { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
        .close-modal:hover { color: #ef4444; }
        .sales-panel { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .sales-card { background: #f8fafc; padding: 20px; border-radius: 16px; text-align: center; border: 1px solid #e2e8f0; }
        .sales-card .amount { font-size: 1.8rem; font-weight: 700; }
        .action-buttons { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; justify-content: center; }
        .report-selector { margin-bottom: 20px; padding: 15px; background: #f8fafc; border-radius: 12px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
        .date-range { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .date-range input { width: auto; min-width: 150px; }
        .alert-info { background: #e0f2fe; padding: 12px; border-radius: 10px; margin-top: 15px; color: #0369a1; }
        .password-cell { display: flex; align-items: center; gap: 8px; font-family: monospace; }
        .eye-icon { cursor: pointer; color: #94a3b8; margin-left: 5px; }
        .eye-icon:hover { color: #3b82f6; }
        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .reset-confirm-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .reset-confirm-box { background: white; border-radius: 20px; padding: 30px; max-width: 400px; text-align: center; }
        .reset-confirm-box button { margin: 10px; padding: 10px 20px; border-radius: 8px; cursor: pointer; }
        .loading { text-align: center; padding: 60px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .calc-note { font-size: 11px; color: #64748b; margin-top: 5px; }
        .profit-card { background: linear-gradient(135deg, #10b981, #059669); color: white; }
        .loss-card { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; }
        .chart-container { max-width: 500px; margin: 0 auto; }
        .date-selector { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; padding: 10px; background: #f8fafc; border-radius: 10px; }
        .date-selector label { margin: 0; }
        .date-selector input { width: auto; min-width: 160px; }
        @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .sales-panel { grid-template-columns: 1fr; } .progress-section { grid-template-columns: 1fr; } .report-selector { flex-direction: column; align-items: stretch; } .date-range { justify-content: center; } }
        @media (max-width: 768px) { .dashboard-layout { flex-direction: column; } .sidebar { width: 100%; position: relative; } }
    </style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><p>Connecting to server...</p></div></div>
<div class="version-badge" onclick="showVersionInfo()">v7.5.0 🔧 Fixed Admin Sales</div>

<script>
    // ========== BISMILAH BUTCHERY PRO - COMPLETE VERSION ==========
    
    function roundToTwo(num) {
        if (isNaN(num)) return 0;
        return Math.round(num * 100) / 100;
    }
    
    const API_URL = '';
    let token = localStorage.getItem('token');
    let currentUser = null;
    let currentPage = 'dashboard';
    let showCreateAccount = false;
    let selectedReport = 'daily';
    let reportStartDate = '';
    let reportEndDate = '';
    let loginPasswordVisible = false;
    let visiblePasswords = {};
    let revenueChart = null;
    let profitChart = null;
    let selectedSalesDate = new Date().toISOString().split('T')[0];
    
    let users = [];
    let inventory = [];
    let dailyClosings = [];
    let currentDaySales = { date: '', totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false, salesByProduct: {} };
    let expenses = [];
    let activityLogs = [];
    
    async function apiCall(endpoint, method = 'GET', body = null) {
        const headers = { 'Content-Type': 'application/json' };
        if (token) headers['Authorization'] = `Bearer ${token}`;
        
        const options = { method, headers };
        if (body) options.body = JSON.stringify(body);
        
        try {
            const response = await fetch(`${API_URL}${endpoint}`, options);
            if (response.status === 401) {
                localStorage.removeItem('token');
                token = null;
                currentUser = null;
                renderApp();
                return null;
            }
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            return null;
        }
    }
    
    async function loadAllData() {
        if (!token) return;
        
        const [usersData, invData, closingsData, salesData, expensesData, logsData] = await Promise.all([
            apiCall('/api/users'),
            apiCall('/api/inventory'),
            apiCall('/api/closings'),
            apiCall('/api/current-sales'),
            apiCall('/api/expenses'),
            apiCall('/api/logs')
        ]);
        
        users = usersData || [];
        inventory = invData || [];
        dailyClosings = closingsData || [];
        currentDaySales = salesData || { date: new Date().toISOString().split('T')[0], totalKg: 0, cashAmount: 0, mpesaAmount: 0, isClosed: false, salesByProduct: {} };
        expenses = expensesData || [];
        activityLogs = logsData || [];
    }
    
    async function loadSalesForDate(date) {
        if (!token) return;
        const salesData = await apiCall(`/api/sales-by-date?date=${date}`);
        if (salesData) {
            currentDaySales = salesData;
            renderApp();
        }
    }
    
    async function login(username, password) {
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const data = await response.json();
            
            if (response.ok && data.token) {
                token = data.token;
                currentUser = data.user;
                localStorage.setItem('token', token);
                await loadAllData();
                renderApp();
                return true;
            } else {
                alert(data.error || 'Invalid credentials!\n\nSuper Admin: superadmin / admin123\nAdmin: admin1 / admin123');
                return false;
            }
        } catch (error) {
            alert('Cannot connect to server. Please refresh the page and try again.');
            return false;
        }
    }
    
    function logout() {
        localStorage.removeItem('token');
        token = null;
        currentUser = null;
        renderApp();
    }
    
    function isSuperAdmin() { return currentUser?.role === 'super_admin'; }
    function canManageUsers() { return isSuperAdmin(); }
    function canViewLogs() { return isSuperAdmin(); }
    function canDelete() { return isSuperAdmin(); }
    
    function setPage(page) { currentPage = page; renderApp(); }
    
    window.changeSalesDate = () => {
        const datePicker = document.getElementById('salesDatePicker');
        if (datePicker) {
            selectedSalesDate = datePicker.value;
            loadSalesForDate(selectedSalesDate);
        }
    };
    
    // Auto calculate KG
    window.autoCalculateKg = () => {
        const productSelect = document.getElementById('saleProduct');
        const selectedProductId = productSelect?.value;
        const cashAmount = parseFloat(document.getElementById('dailyCash')?.value) || 0;
        const mpesaAmount = parseFloat(document.getElementById('dailyMpesa')?.value) || 0;
        const totalAmount = cashAmount + mpesaAmount;
        
        if (!selectedProductId || selectedProductId === '' || totalAmount <= 0) {
            return;
        }
        
        const product = inventory.find(p => p.id == selectedProductId);
        if (product && product.priceKg > 0) {
            const calculatedKg = totalAmount / product.priceKg;
            const kgInput = document.getElementById('dailyKg');
            if (kgInput) {
                kgInput.value = roundToTwo(calculatedKg).toFixed(2);
            }
        }
    };
    
    window.onProductChange = () => {
        const kgInput = document.getElementById('dailyKg');
        if (kgInput) kgInput.value = '';
        autoCalculateKg();
    };
    
    // ADD SALE - FIXED FOR BOTH ADMIN AND SUPER ADMIN
    window.addSale = async () => {
        console.log('addSale function called');
        
        const productSelect = document.getElementById('saleProduct');
        const selectedProductId = productSelect?.value;
        let kg = parseFloat(document.getElementById('dailyKg')?.value);
        const cash = parseFloat(document.getElementById('dailyCash')?.value) || 0;
        const mpesa = parseFloat(document.getElementById('dailyMpesa')?.value) || 0;
        const saleDate = document.getElementById('salesDatePicker')?.value || new Date().toISOString().split('T')[0];
        
        kg = roundToTwo(kg);
        
        if (!selectedProductId || selectedProductId === '') {
            alert('Please select a product');
            return;
        }
        if (isNaN(kg) || kg <= 0) {
            alert('Enter valid KG (auto-calculated from amount)');
            return;
        }
        
        const product = inventory.find(p => p.id == selectedProductId);
        if (!product) {
            alert('Product not found');
            return;
        }
        
        if (product.stockKg < kg) {
            alert(`Not enough stock! Only ${roundToTwo(product.stockKg)} kg available for ${product.name}`);
            return;
        }
        
        const result = await apiCall('/api/current-sales', 'POST', { 
            productId: selectedProductId,
            productName: product.name,
            kg, 
            cash: roundToTwo(cash), 
            mpesa: roundToTwo(mpesa),
            date: saleDate
        });
        
        if (result) {
            await loadSalesForDate(saleDate);
            await loadAllData();
            renderApp();
            alert(`✅ Sold ${kg}kg of ${product.name} on ${saleDate}!`);
            document.getElementById('dailyKg').value = '';
            document.getElementById('dailyCash').value = '';
            document.getElementById('dailyMpesa').value = '';
            document.getElementById('saleProduct').value = '';
        } else {
            alert('Failed to add sale. Please try again.');
        }
    };
    
    // CLOSE DAY - FIXED FOR BOTH ADMIN AND SUPER ADMIN
    window.closeDay = async () => {
        console.log('closeDay function called');
        
        const today = selectedSalesDate;
        if (currentDaySales.isClosed) {
            alert('Already closed');
            return;
        }
        if (currentDaySales.totalKg === 0 && currentDaySales.cashAmount === 0 && currentDaySales.mpesaAmount === 0) {
            alert('No sales to close');
            return;
        }
        
        const total = currentDaySales.cashAmount + currentDaySales.mpesaAmount;
        
        if (confirm(`Close ${today}?\nTotal KG: ${roundToTwo(currentDaySales.totalKg)} kg\nCash: KES ${currentDaySales.cashAmount.toLocaleString()}\nM-Pesa: KES ${currentDaySales.mpesaAmount.toLocaleString()}\nTotal Revenue: KES ${roundToTwo(total).toLocaleString()}`)) {
            const result = await apiCall('/api/close-day', 'POST', { date: today });
            if (result) {
                await loadSalesForDate(today);
                await loadAllData();
                renderApp();
                alert('✅ Day closed!');
            } else {
                alert('Failed to close day.');
            }
        }
    };
    
    // START NEW DAY
    window.startNewDay = async () => {
        const today = selectedSalesDate;
        const result = await apiCall('/api/new-day', 'POST', { date: today });
        if (result) {
            await loadSalesForDate(today);
            await loadAllData();
            renderApp();
            alert('✅ New day started!');
        }
    };
    
    // Delete sale entry
    window.deleteSaleEntry = async (productName, kg) => {
        if (!confirm(`Delete sale: ${kg}kg of ${productName}? This will restore stock.`)) {
            return;
        }
        
        const result = await apiCall('/api/delete-sale', 'POST', { 
            productName, 
            kg: roundToTwo(parseFloat(kg)),
            date: selectedSalesDate
        });
        
        if (result) {
            await loadSalesForDate(selectedSalesDate);
            await loadAllData();
            renderApp();
            alert(`✅ Sale entry deleted! Stock restored for ${productName}.`);
        } else {
            alert('Failed to delete sale entry.');
        }
    };
    
    // Export functions
    window.exportToExcel = () => {
        const filtered = getFilteredClosings();
        if (filtered.length === 0) {
            alert('No data to export');
            return;
        }
        
        const data = filtered.map(r => ({
            'Date': r.date,
            'Total KG': roundToTwo(r.totalKg),
            'Cash Amount': r.cashAmount,
            'M-Pesa Amount': r.mpesaAmount,
            'Total Revenue': r.totalRevenue,
            'Closed By': r.closedBy
        }));
        
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Sales Report');
        XLSX.writeFile(wb, `butchery_report_${new Date().toISOString().split('T')[0]}.xlsx`);
        alert('✅ Report exported to Excel!');
    };
    
    window.exportToPDF = () => {
        const filtered = getFilteredClosings();
        if (filtered.length === 0) {
            alert('No data to export');
            return;
        }
        
        const totalRevenue = filtered.reduce((sum, r) => sum + r.totalRevenue, 0);
        const totalKg = filtered.reduce((sum, r) => sum + r.totalKg, 0);
        const totalExpenses = expenses.filter(e => {
            const expenseDate = new Date(e.date);
            const start = reportStartDate ? new Date(reportStartDate) : null;
            const end = reportEndDate ? new Date(reportEndDate) : null;
            if (start && expenseDate < start) return false;
            if (end && expenseDate > end) return false;
            return true;
        }).reduce((sum, e) => sum + e.amount, 0);
        const totalProfit = totalRevenue - totalExpenses;
        
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html>
            <head>
                <title>Butchery Sales Report</title>
                <style>
                    body { font-family: Arial, sans-serif; padding: 20px; }
                    h1 { color: #1e293b; text-align: center; }
                    .summary { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; }
                    .summary-box { background: #f1f5f9; padding: 15px; border-radius: 8px; flex: 1; text-align: center; }
                    .summary-box h3 { margin-bottom: 5px; }
                    .summary-box .value { font-size: 24px; font-weight: bold; color: #3b82f6; }
                    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                    th { background: #f8fafc; }
                    .profit { color: #10b981; }
                    .loss { color: #ef4444; }
                </style>
            </head>
            <body>
                <h1>Bismillah Butchery Pro - Sales Report</h1>
                <p>Period: ${reportStartDate || 'Start'} to ${reportEndDate || 'End'}</p>
                <div class="summary">
                    <div class="summary-box"><h3>Total Revenue</h3><div class="value">KES ${totalRevenue.toLocaleString()}</div></div>
                    <div class="summary-box"><h3>Total KG Sold</h3><div class="value">${roundToTwo(totalKg)} kg</div></div>
                    <div class="summary-box"><h3>Total Expenses</h3><div class="value">KES ${totalExpenses.toLocaleString()}</div></div>
                    <div class="summary-box"><h3>Total Profit</h3><div class="value ${totalProfit >= 0 ? 'profit' : 'loss'}">KES ${totalProfit.toLocaleString()}</div></div>
                </div>
                <table>
                    <thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total Revenue</th><th>Closed By</th></table></thead>
                    <tbody>
                        ${filtered.map(r => `<tr><td style="padding:8px">${r.date}</td><td style="padding:8px">${roundToTwo(r.totalKg)}</td><td style="padding:8px">KES ${r.cashAmount.toLocaleString()}</td><td style="padding:8px">KES ${r.mpesaAmount.toLocaleString()}</td><td style="padding:8px">KES ${r.totalRevenue.toLocaleString()}</td><td style="padding:8px">${r.closedBy}</td></tr>`).join('')}
                    </tbody>
                </table>

    function getFilteredClosings() {
        let filtered = [...dailyClosings];
        
        if (reportStartDate) {

            filtered = filtered.filter(r => new Date(r.date) >= start);
        }
        if (reportEndDate) {
            const end = new Date(reportEndDate);
            end.setHours(23, 59, 59);
            filtered = filtered.filter(r => new Date(r.date) <= end);

        if (selectedReport === 'daily') {
            filtered = filtered.slice(0, 7);
        }
        
        return filtered;
    }

    }
    
    function renderReports() {
        let filtered = getFilteredClosings();
        const totalRevenue = filtered.reduce((sum, r) => sum + r.totalRevenue, 0);
        const totalKg = filtered.reduce((sum, r) => sum + r.totalKg, 0);
        
        const filteredExpenses = expenses.filter(e => {
            const expenseDate = new Date(e.date);
            const start = reportStartDate ? new Date(reportStartDate) : null;
            const end = reportEndDate ? new Date(reportEndDate) : null;
            if (start && expenseDate < start) return false;
            if (end && expenseDate > end) return false;
            return true;
        });
        const totalExpenses = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
        const totalProfit = totalRevenue - totalExpenses;
        const profitMargin = totalRevenue > 0 ? ((totalProfit / totalRevenue) * 100).toFixed(1) : 0;
        const profitCardClass = totalProfit >= 0 ? 'profit-card' : 'loss-card';
        
        const chartLabels = filtered.map(r => r.date).reverse();
        const chartRevenue = filtered.map(r => r.totalRevenue).reverse();
        
        if (revenueChart) revenueChart.destroy();
        if (profitChart) profitChart.destroy();
        
        setTimeout(() => {
            const revenueCtx = document.getElementById('revenueChart')?.getContext('2d');
            const profitCtx = document.getElementById('profitChart')?.getContext('2d');
            if (revenueCtx) {
                revenueChart = new Chart(revenueCtx, { type: 'line', data: { labels: chartLabels, datasets: [{ label: 'Revenue (KES)', data: chartRevenue, borderColor: '#3b82f6', backgroundColor: 'rgba(59,130,246,0.1)', fill: true, tension: 0.4 }] }, options: { responsive: true } });
            }
            if (profitCtx && filtered.length > 0) {
                const dailyProfits = filtered.map(r => { const dayExpenses = filteredExpenses.filter(e => e.date === r.date).reduce((sum, e) => sum + e.amount, 0); return r.totalRevenue - dayExpenses; }).reverse();
                profitChart = new Chart(profitCtx, { type: 'bar', data: { labels: chartLabels, datasets: [{ label: 'Daily Profit (KES)', data: dailyProfits, backgroundColor: dailyProfits.map(p => p >= 0 ? '#10b981' : '#ef4444'), borderRadius: 8 }] }, options: { responsive: true } });
            }
        }, 100);
        
        return `<div class="report-selector"><div class="date-range"><label>📅 From:</label><input type="date" id="reportStartDate" value="${reportStartDate}" onchange="updateDateRange()"><label>To:</label><input type="date" id="reportEndDate" value="${reportEndDate}" onchange="updateDateRange()"><button class="btn-edit" onclick="resetDateRange()">Reset</button></div><div style="display: flex; gap: 10px;"><button class="btn-export" onclick="exportToExcel()"><i class="fas fa-file-excel"></i> Export Excel</button><button class="btn-export" onclick="exportToPDF()"><i class="fas fa-file-pdf"></i> Export PDF</button></div></div>
        <div class="stats-grid"><div class="stat-card"><div class="stat-title">Total Revenue</div><div class="stat-value">KES ${roundToTwo(totalRevenue).toLocaleString()}</div></div><div class="stat-card"><div class="stat-title">Total KG Sold</div><div class="stat-value">${roundToTwo(totalKg)} kg</div></div><div class="stat-card"><div class="stat-title">Total Expenses</div><div class="stat-value">KES ${roundToTwo(totalExpenses).toLocaleString()}</div></div><div class="stat-card ${profitCardClass}"><div class="stat-title">Net Profit</div><div class="stat-value">KES ${roundToTwo(totalProfit).toLocaleString()}</div><div class="stat-change">Margin: ${profitMargin}%</div></div></div>
        <div class="card"><div class="card-header"><h2><i class="fas fa-chart-line"></i> Revenue Trend</h2></div><div class="chart-container"><canvas id="revenueChart" height="200"></canvas></div></div>
        <div class="card"><div class="card-header"><h2><i class="fas fa-chart-bar"></i> Daily Profit/Loss</h2></div><div class="chart-container"><canvas id="profitChart" height="200"></canvas></div></div>
        ${filtered.length === 0 ? `<div class="empty-state"><i class="fas fa-chart-line"></i><h3>No Reports Available</h3><p>No sales data found for the selected period.</p></div>` : `
        <div class="card"><div class="card-header"><h2><i class="fas fa-table"></i> Detailed Sales Records</h2></div><div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>KG</th><th>Cash</th><th>M-Pesa</th><th>Total Revenue</th><th>Closed By</th>${canDelete() ? '<th>Action</th>' : ''}</tr></thead><tbody>${filtered.map(r => `<tr><td style="padding:8px">${r.date}</td><td style="padding:8px">${roundToTwo(r.totalKg)}</td><td style="padding:8px">KES ${r.cashAmount.toLocaleString()}</td><td style="padding:8px">KES ${r.mpesaAmount.toLocaleString()}</td><td style="padding:8px"><strong>KES ${r.totalRevenue.toLocaleString()}</strong></td><td style="padding:8px">${r.closedBy}</td>${canDelete() ? `<td style="padding:8px"><button class="btn-delete" onclick="deleteClosingRecord(${r.id})">Delete</button></td>` : ''}</tr>`).join('')}</tbody>}</div></div>
        <div class="card"><div class="card-header"><h2><i class="fas fa-receipt"></i> Expenses within Period</h2></div><div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th></tr></thead><tbody>${filteredExpenses.length === 0 ? '<tr><td colspan="4" style="text-align:center; padding:40px;">No expenses recorded in this period</td>' : filteredExpenses.map(e => `<tr><td style="padding:8px">${e.date}</td><td style="padding:8px">${e.category}</td><td style="padding:8px">KES ${e.amount.toLocaleString()}</td><td style="padding:8px">${e.description || '-'}</td></tr>`).join('')}</tbody>}</div></div>`}`;
    }
    
    function renderSales() {
        const productOptions = inventory.map(p => `<option value="${p.id}">${p.name} (${roundToTwo(p.stockKg)} kg available) - KES ${p.priceKg}/kg</option>`).join('');
        const isClosed = currentDaySales.isClosed;
        
        return `<div class="sales-panel">
            <div class="sales-card"><h3>📦 Total KG</h3><div class="amount">${roundToTwo(currentDaySales.totalKg)} kg</div></div>
            <div class="sales-card"><h3>💰 Cash</h3><div class="amount">KES ${currentDaySales.cashAmount.toLocaleString()}</div></div>
            <div class="sales-card"><h3>📱 M-Pesa</h3><div class="amount">KES ${currentDaySales.mpesaAmount.toLocaleString()}</div></div>
        </div>
        
        <div class="card">
            <div class="card-header"><h2>📅 Select Date & Record Sale</h2></div>
            <div class="date-selector">
                <label><i class="fas fa-calendar-alt"></i> Sale Date:</label>
                <input type="date" id="salesDatePicker" value="${selectedSalesDate}" onchange="changeSalesDate()">
                <span class="alert-info" style="margin:0; padding:5px 10px;">Status: ${isClosed ? '🔒 Closed' : '🟢 Open'}</span>
                ${isClosed ? '<span style="color:#ef4444; margin-left:10px;"><i class="fas fa-lock"></i> This day is closed. Start a new day to record sales.</span>' : ''}
            </div>
            <div class="form-group">
                <label>🥩 Select Product</label>
                <select id="saleProduct" class="product-select" onchange="onProductChange()">
                    <option value="">-- Select Product --</option>
                    ${productOptions}
                </select>
            </div>
            <div class="form-group">
                <label>💵 Cash Amount (KES)</label>
                <input type="number" id="dailyCash" placeholder="Enter cash amount" oninput="autoCalculateKg()">
            </div>
            <div class="form-group">
                <label>📲 M-Pesa Amount (KES)</label>
                <input type="number" id="dailyMpesa" placeholder="Enter M-Pesa amount" oninput="autoCalculateKg()">
            </div>
            <div class="form-group">
                <label>📦 Quantity Sold (kg) - Auto Calculated</label>
                <input type="number" id="dailyKg" step="0.1" placeholder="Auto-calculated" readonly style="background-color:#f3f4f6; cursor:not-allowed;">
                <div class="calc-note"><i class="fas fa-calculator"></i> KG is automatically calculated from Cash + M-Pesa divided by product price</div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-success" onclick="addSale()"><i class="fas fa-plus-circle"></i> Add Sale</button>
                <button class="btn btn-warning" onclick="closeDay()"><i class="fas fa-lock"></i> Close Day</button>
                <button class="btn" onclick="startNewDay()"><i class="fas fa-sun"></i> Start New Day</button>
            </div>
        </div>
        
        ${currentDaySales.salesByProduct && Object.keys(currentDaySales.salesByProduct).length > 0 ? `
        <div class="card">
            <div class="card-header"><h2>📊 Sales for ${selectedSalesDate}</h2></div>
            <div class="table-container">
                <table class="data-table">
                    <thead><tr><th>Product</th><th>Quantity (kg)</th><th>Revenue (KES)</th><th>Action</th></tr></thead>
                    <tbody>
                        ${Object.entries(currentDaySales.salesByProduct).map(([product, kg]) => {
                            const productInfo = inventory.find(p => p.name === product);
                            const pricePerKg = productInfo?.priceKg || 0;
                            const revenue = kg * pricePerKg;
                            return `<tr><td style="padding:8px">${product}</td><td style="padding:8px">${roundToTwo(kg).toFixed(2)} kg</td><td style="padding:8px">KES ${roundToTwo(revenue).toLocaleString()} (${pricePerKg}/kg)</td><td style="padding:8px"><button class="btn-delete" onclick="deleteSaleEntry('${product.replace(/'/g, "\\'")}', ${kg})">Delete</button></td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
            </div>
        </div>
        ` : `<div class="alert-info"><i class="fas fa-info-circle"></i> No sales recorded for ${selectedSalesDate}. Select a product and add sale above.</div>`}
        
        <div class="alert-info"><i class="fas fa-info-circle"></i> <strong>Tip:</strong> Change the date above to record sales for any day, past or present!</div>`;
    }
    
    function renderExpenses() {
        const today = new Date().toISOString().split('T')[0];
        return `<div class="card"><div class="card-header"><h2>💰 Add Expense</h2></div><div class="form-group"><label>Expense Category</label><input id="expCategory" placeholder="e.g., Transport, Utilities, Rent"></div><div class="form-group"><label>Amount (KES)</label><input id="expAmount" type="number" placeholder="Enter amount"></div><div class="form-group"><label>Date</label><input id="expenseDate" type="date" value="${today}"></div><div class="form-group"><label>Description (Optional)</label><textarea id="expDesc" placeholder="Additional details"></textarea></div><button class="btn btn-success" onclick="addExpenseWithDate()"><i class="fas fa-plus"></i> Add Expense</button></div>
        <div class="card"><div class="card-header"><h2>📋 Expense History</h2></div><div class="table-container"><table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Amount</th><th>Description</th><th>Action</th><tr></thead><tbody>${expenses.length === 0 ? '<tr><td colspan="5" style="text-align:center; padding:40px;">No expenses recorded yet</td>' : expenses.map(e => `<tr><td style="padding:8px">${e.date}</td><td style="padding:8px">${e.category}</td><td style="padding:8px">KES ${e.amount.toLocaleString()}</td><td style="padding:8px">${e.description || '-'}</td><td style="padding:8px">${isSuperAdmin() ? `<button class="btn-delete" onclick="deleteExpense(${e.id})">Delete</button>` : 'View Only'}</td></tr>`).join('')}</tbody>}</div></div>`;
    }
    
    function renderInventory() {
        return `<div class="table-container"><table class="data-table"><thead><tr><th>Name</th><th>Animal</th><th>Stock (kg)</th><th>Price/kg</th><th>Cost/kg</th><th>Status</th><th>Actions</th></tr></thead><tbody>${inventory.map(p => `<tr><td style="padding:8px">${p.name}</td><td style="padding:8px">${p.animal}</td><td style="padding:8px">${roundToTwo(p.stockKg)}</td><td style="padding:8px">KES ${p.priceKg}</td><td style="padding:8px">KES ${p.costKg}</td><td style="padding:8px">${p.stockKg <= p.lowStockAlert ? '<span style="color:#ef4444;">⚠️ Low Stock</span>' : '<span style="color:#10b981;">✓ In Stock</span>'}</td><td style="padding:8px"><button class="btn-edit" onclick="openEditProductModal(${p.id})">Edit</button> ${isSuperAdmin() ? `<button class="btn-delete" onclick="deleteInventoryProduct(${p.id})">Delete</button>` : ''}</td></tr>`).join('')}</tbody>}</div>`;
    }
    
    function renderUsers() {
        return `<div class="table-container"><table class="data-table"><thead><tr><th>Full Name</th><th>Username</th><th>Password</th><th>Role</th><th>Status</th><th>Last Login</th><th>Actions</th></tr></thead><tbody>${users.map(u => `<tr><td style="padding:8px">${u.fullName}</td><td style="padding:8px">${u.username}</td><td class="password-cell" style="padding:8px">${isSuperAdmin() ? (visiblePasswords[u.id] ? u.password : '••••••') : '••••••'} ${isSuperAdmin() ? `<i class="fas ${visiblePasswords[u.id] ? 'fa-eye-slash' : 'fa-eye'} eye-icon" onclick="togglePasswordVisibility(${u.id})"></i>` : ''}</td><td style="padding:8px"><span class="${u.role === 'super_admin' ? 'role-badge-super' : 'role-badge-admin'}">${u.role === 'super_admin' ? '👑 Super Admin' : '👤 Admin'}</span></td><td style="padding:8px">${u.isActive ? '✅ Active' : '❌ Inactive'}</td><td style="padding:8px">${u.lastLogin || 'Never'}</td><td style="padding:8px">${u.username !== 'superadmin' ? `<button class="btn-edit" onclick="openEditUserModal(${u.id})">Edit</button> <button class="btn-delete" onclick="deleteUser(${u.id})">Delete</button>` : '<span class="role-badge-super">Protected</span>'}</td></tr>`).join('')}</tbody>}</div>`;
    }
    
    function renderLogs() {
        return `<div class="table-container"><table class="data-table"><thead><tr><th>Time</th><th>User</th><th>Role</th><th>Action</th><th>Details</th></tr></thead><tbody>${activityLogs.length === 0 ? '<td><td colspan="5" style="text-align:center; padding:40px;">No activity logs yet</tr>' : activityLogs.slice(0, 100).map(l => `<tr><td style="padding:8px">${l.timestamp}</td><td style="padding:8px">${l.user}</td><td style="padding:8px">${l.userRole}</td><td style="padding:8px">${l.action}</td><td style="padding:8px">${l.details}</td></tr>`).join('')}</tbody>}</div>`;
    }
    
    async function renderApp() {
        const app = document.getElementById('app');
        
        if (!token || !currentUser) {
            const savedToken = localStorage.getItem('token');
            if (savedToken) {
                token = savedToken;
                const me = await apiCall('/api/me');
                if (me) {
                    currentUser = me;
                    await loadAllData();
                    renderApp();
                    return;
                } else {
                    token = null;
                    localStorage.removeItem('token');
                }
            }
            
            app.innerHTML = `<div class="login-container"><i class="fas fa-drumstick-bite" style="font-size:48px; color:#3b82f6;"></i><h2 style="margin:20px 0;">Bismillah Butchery Pro</h2><div class="form-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Enter your username"></div><div class="form-group"><div class="password-wrapper"><label>Password</label><input type="password" id="loginPasswordInput" placeholder="Enter your password"><button class="password-toggle" onclick="toggleLoginPassword()" type="button"><i class="fas fa-eye"></i></button></div></div><button class="btn" style="width:100%;" onclick="login(document.getElementById('loginUsername').value, document.getElementById('loginPasswordInput').value)">Login</button><button class="create-account-btn" onclick="showCreateAccountForm()" style="margin-top:15px; background:none; border:none; color:#3b82f6; cursor:pointer;">+ Create New Account</button>${showCreateAccount ? `<div class="modal"><div class="modal-content"><h3>Create Admin Account</h3><input type="text" id="createFullName" placeholder="Full Name *" style="margin:10px 0; width:100%;"><input type="text" id="createUsername" placeholder="Username *" style="margin:10px 0; width:100%;"><input type="password" id="createPassword" placeholder="Password *" style="margin:10px 0; width:100%;"><input type="password" id="createConfirmPassword" placeholder="Confirm Password *" style="margin:10px 0; width:100%;"><input type="email" id="createEmail" placeholder="Email (Optional)" style="margin:10px 0; width:100%;"><input type="tel" id="createPhone" placeholder="Phone (Optional)" style="margin:10px 0; width:100%;"><button class="btn btn-success" onclick="submitCreateAccount()" style="width:100%;">Register</button><button class="btn-delete" onclick="hideCreateAccountForm()" style="margin-top:10px; width:100%;">Cancel</button></div></div>` : ''}</div>`;
            return;
        }
        
        const navItems = [
            { id: 'dashboard', icon: 'fa-chart-line', label: 'Dashboard' },
            { id: 'sales', icon: 'fa-cash-register', label: 'Today\'s Sales' },
            { id: 'inventory', icon: 'fa-boxes', label: 'Inventory' },
            { id: 'expenses', icon: 'fa-receipt', label: 'Expenses' },
            { id: 'reports', icon: 'fa-chart-bar', label: 'Reports' }
        ];
        if (canManageUsers()) navItems.push({ id: 'users', icon: 'fa-users', label: 'Users' });
        if (canViewLogs()) navItems.push({ id: 'logs', icon: 'fa-history', label: 'Activity Logs' });
        
        app.innerHTML = `<div class="app-container"><div class="dashboard-layout"><div class="sidebar"><div class="logo-area"><h1><i class="fas fa-drumstick-bite"></i> Bismillah</h1><p>Premium Fresh Meat</p></div>${navItems.map(item => `<div class="nav-item ${currentPage === item.id ? 'active' : ''}" onclick="setPage('${item.id}')"><i class="fas ${item.icon}"></i> ${item.label}</div>`).join('')}${isSuperAdmin() ? `<div style="margin-top:20px; padding-top:20px; border-top:1px solid #e2e8f0;"><div class="nav-item" onclick="resetAllData()" style="color:#ef4444;">Reset All Data</div></div>` : ''}</div><div class="main-content"><div class="top-bar"><div><h3>${currentUser.fullName} ${isSuperAdmin() ? '<i class="fas fa-crown" style="color:#f59e0b;"></i>' : ''}</h3><span class="role-badge">${isSuperAdmin() ? '🌟 Super Admin' : '👤 Admin'}</span></div><div><button class="btn-edit" onclick="openEditSelfModal()" style="margin-right:10px;"><i class="fas fa-user-edit"></i> Edit Profile</button><button class="btn-delete" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button></div></div><div class="card"><div class="card-header"><h2>${navItems.find(i=>i.id===currentPage)?.label || 'Dashboard'}</h2>${currentPage === 'inventory' && isSuperAdmin() ? `<button class="btn" onclick="openAddProductModal()"><i class="fas fa-plus"></i> Add Product</button>` : ''}${currentPage === 'users' && isSuperAdmin() ? `<button class="btn btn-success" onclick="showAddUserModal()" style="margin-left:10px;"><i class="fas fa-user-plus"></i> Add User</button>` : ''}</div><div>${currentPage === 'dashboard' ? renderDashboard() : currentPage === 'sales' ? renderSales() : currentPage === 'inventory' ? renderInventory() : currentPage === 'expenses' ? renderExpenses() : currentPage === 'reports' ? renderReports() : currentPage === 'users' ? renderUsers() : renderLogs()}</div></div></div></div></div>`;
    }
    
    (async () => {
        const savedToken = localStorage.getItem('token');
        if (savedToken) {
            token = savedToken;
            const me = await apiCall('/api/me');
            if (me) {
                currentUser = me;
                await loadAllData();
            } else {
                token = null;
                localStorage.removeItem('token');
            }
        }
        renderApp();
    })();
</script>
</body>
</html>
